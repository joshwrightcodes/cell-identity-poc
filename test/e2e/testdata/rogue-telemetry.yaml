# The test data of TestM3RogueTelemetryFails, applied in dev-cell-1. The label of the namespace lets
# mise run gate:m3:repair remove it after a run that stopped early. The namespace holds the
# ServiceAccount of the uplink subject, with the right to ask for its own token, so that a probe pod
# can present a token that was made in rogue for the same names.
apiVersion: v1
kind: Namespace
metadata:
  name: m3-rogue-telemetry
  labels:
    cell.poc.internal/e2e: "true"
    poc.internal/test: "true"
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: otel-uplink
  namespace: m3-rogue-telemetry
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: otel-uplink
  namespace: m3-rogue-telemetry
rules:
  - apiGroups: [""]
    resources: [serviceaccounts/token]
    resourceNames: [otel-uplink]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: otel-uplink
  namespace: m3-rogue-telemetry
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: otel-uplink
subjects:
  - kind: ServiceAccount
    name: otel-uplink
    namespace: m3-rogue-telemetry
