# The cell identity stub: celld with a SPIRE agent sidecar. render.sh fills in the celld image and
# the network peers, and components/lib/spire-sidecar.sh adds the agent, its token Role and its
# ConfigMaps. The agent attests to the SPIRE server of the environment with the cluster_jwt
# plugin, and celld gets its X.509 SVID from the agent.
# The namespace stays out of the mesh, so identity does not depend on Istio.
# celld also applies the signed bundle sets of its cell. It reads them from the registry mirror, writes them to the bundle store
# with a projected token of the audience bundle-store, and asks Argo CD for the state of the Applications. Role celld-argocd
# and ClusterRole celld-netpol-read give the rights that the apply engine needs. The guards bundles-spare-harness and
# bundles-app-limits come from components/lib/bundle-guard.sh.
apiVersion: v1
kind: Namespace
metadata:
  name: cell-identity-system
  labels:
    istio-injection: disabled
    pod-security.kubernetes.io/enforce: restricted
    cell.poc.internal/harness: cell-identity
---
# The pod mounts no token for this account. Only the agent container and the celld container get a
# projected API token, each from its own volume.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: celld
  namespace: cell-identity-system
  labels:
    cell.poc.internal/harness: cell-identity
automountServiceAccountToken: false
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: cell-identity-system
  labels:
    cell.poc.internal/harness: cell-identity
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
# celld resolves the collector name, so the namespace needs DNS.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: cell-identity-system
  labels:
    cell.poc.internal/harness: cell-identity
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
        - ipBlock:
            cidr: "10.120.0.10/32"
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
# The pod reaches only the SPIRE server node port, the stream and bind node ports of the cell gateway
# (flow N41), all in the environment control plane, the API server, and the collector. It also reads the
# bundle sets from the registry mirror (flow N45) and writes them to the bundle store (flow N46). It accepts
# no connections: the probes run in the pod.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: celld
  namespace: cell-identity-system
  labels:
    cell.poc.internal/harness: cell-identity
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: celld
  policyTypes: [Ingress, Egress]
  egress:
    - to:
        - ipBlock:
            cidr: "10.9.0.9/32"
      ports:
        - protocol: TCP
          port: 30081
    - to:
        - ipBlock:
            cidr: "10.9.0.9/32"
      ports:
        - protocol: TCP
          port: 30450
        - protocol: TCP
          port: 30451
    - to:
        - ipBlock:
            cidr: 172.18.0.5/32
      ports:
        - protocol: TCP
          port: 6443
    - to:
        - ipBlock:
            cidr: "10.120.0.1/32"
      ports:
        - protocol: TCP
          port: 443
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: otel-collector
      ports:
        - protocol: TCP
          port: 4317
    - to:
        - ipBlock:
            cidr: "172.18.0.7/32"
      ports:
        - protocol: TCP
          port: 5000
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cell-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: bundle-store
      ports:
        - protocol: TCP
          port: 5000
---
# The bundle store admits celld on port 5000. This policy is a harness plane policy: every pod of cell-system is
# selected, so a bundle cannot move the store out of the policy by a label, and the apply engine refuses a bundle
# that names this policy.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: plane-celld-store
  namespace: cell-system
  labels:
    cell.poc.internal/harness: cell-identity
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cell-identity-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: celld
      ports:
        - protocol: TCP
          port: 5000
---
# The operation records and the demo target of celld. The namespace holds no pod and stays out of the mesh.
apiVersion: v1
kind: Namespace
metadata:
  name: cell-ops-system
  labels:
    istio-injection: disabled
    pod-security.kubernetes.io/enforce: restricted
    cell.poc.internal/harness: cell-identity
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: cell-ops-system
  labels:
    cell.poc.internal/harness: cell-identity
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
# celld keeps one record for each operation, and the demo log, as ConfigMaps in this namespace only.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: celld-ops
  namespace: cell-ops-system
  labels:
    cell.poc.internal/harness: cell-identity
rules:
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [create, get, list, update, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: celld-ops
  namespace: cell-ops-system
  labels:
    cell.poc.internal/harness: cell-identity
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: celld-ops
subjects:
  - kind: ServiceAccount
    name: celld
    namespace: cell-identity-system
---
# The apply engine of celld lists the Applications, and asks Argo CD for a hard refresh of the Application root. Nothing
# else in argocd.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: celld-argocd
  namespace: argocd
  labels:
    cell.poc.internal/harness: cell-identity
rules:
  - apiGroups: [argoproj.io]
    resources: [applications]
    verbs: [list]
  - apiGroups: [argoproj.io]
    resources: [applications]
    resourceNames: [root]
    verbs: [patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: celld-argocd
  namespace: argocd
  labels:
    cell.poc.internal/harness: cell-identity
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: celld-argocd
subjects:
  - kind: ServiceAccount
    name: celld
    namespace: cell-identity-system
---
# The engine reads the NetworkPolicies that carry the harness label in every namespace, so that no bundle blocks a plane flow.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: celld-netpol-read
  labels:
    cell.poc.internal/harness: cell-identity
rules:
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: [list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: celld-netpol-read
  labels:
    cell.poc.internal/harness: cell-identity
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: celld-netpol-read
subjects:
  - kind: ServiceAccount
    name: celld
    namespace: cell-identity-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: celld
  namespace: cell-identity-system
  labels:
    app.kubernetes.io/name: celld
    cell.poc.internal/harness: cell-identity
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: celld
  template:
    metadata:
      labels:
        app.kubernetes.io/name: celld
      annotations:
        poc.internal/trust-bundle-sha256: "a9b0e85b184525a44655bdca8f337af2ba419eb5b9dccf1dd99b8c2eecf9ae38"
        poc.internal/op-key-sha256: "b01198f80d7523505107539aebd55b08d1923bfd91f72483a644cfdf40c51142"
        cell.poc.internal/config-checksum: 90422a3ae8aa56071729d70fd371e1d8a1e600fe2a7e8cd49e0a8c3ec9b6f770
    spec:
      serviceAccountName: celld
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: spire-agent
          image: ghcr.io/spiffe/spire-agent:1.15.5@sha256:3652c732b0f0d36f4dd78394230a1b1cd0ddcc29548a46c67a996b1a78c14481
          args: ["-config", "/run/spire/config/agent.conf"]
          readinessProbe:
            exec:
              command: ["/opt/spire/bin/spire-agent", "healthcheck", "-socketPath", "/run/spire/agent/agent.sock"]
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: ["/opt/spire/bin/spire-agent", "healthcheck", "-shallow", "-socketPath", "/run/spire/agent/agent.sock"]
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: agent-config
              mountPath: /run/spire/config
              readOnly: true
            - name: trust-bundle
              mountPath: /run/spire/bundle
              readOnly: true
            - name: data
              mountPath: /run/spire/data
            - name: agent-socket
              mountPath: /run/spire/agent
            - name: plugins
              mountPath: /run/spire/plugins
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: api-token
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: SERVICE_ACCOUNT
              valueFrom:
                fieldRef:
                  fieldPath: spec.serviceAccountName
        # The celld entry selects unix:uid:65532, the user of the ko base image.
        - name: celld
          image: "localhost:5001/celld@sha256:stub"
          # celld binds the cell issuer to the management plane and claims signed operations through the
          # cell gateway in the environment control plane. It loads the trust bundle and the operation
          # keys only at start, so each mount has a checksum annotation on the pod template.
          args:
            - --cell=dev-cell-1
            - --env=dev
            - --gateway=10.9.0.9:30450
            - --gateway-bind=10.9.0.9:30451
            - --gateway-id=spiffe://dev.env.poc.internal/cp/gateway
            - --trust-bundle=/run/celld/trust-bundle/bundle.crt
            - --op-key-dir=/run/celld/op-key
            - --ops-namespace=cell-ops-system
            - --bundle-mirror=172.18.0.7:5000
            - --bundle-store=bundle-store.cell-system.svc.cluster.local:5000
            - --bundle-store-token=/var/run/secrets/bundle-store/token
            - --bundle-health-timeout=5m
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: SERVICE_ACCOUNT
              valueFrom:
                fieldRef:
                  fieldPath: spec.serviceAccountName
            - name: SPIFFE_ENDPOINT_SOCKET
              value: unix:///run/spire/agent/agent.sock
            - name: OTEL_SERVICE_NAME
              value: celld
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector.observability-system.svc.cluster.local:4317
          securityContext:
            runAsUser: 65532
            runAsGroup: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: agent-socket
              mountPath: /run/spire/agent
              readOnly: true
            - name: spire-trust-bundle
              mountPath: /run/celld/trust-bundle
              readOnly: true
            - name: mgmt-op-key
              mountPath: /run/celld/op-key
              readOnly: true
            - name: celld-api-token
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
            - name: bundle-store-token
              mountPath: /var/run/secrets/bundle-store
              readOnly: true
      volumes:
        - name: spire-trust-bundle
          configMap:
            name: spire-trust-bundle
        - name: mgmt-op-key
          configMap:
            name: mgmt-op-key
        # The bundle store accepts this token only for the audience bundle-store, and only from the account celld.
        - name: bundle-store-token
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  audience: bundle-store
                  expirationSeconds: 600
        - name: celld-api-token
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 3600
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
              - downwardAPI:
                  items:
                    - path: namespace
                      fieldRef:
                        fieldPath: metadata.namespace
        - name: agent-config
          configMap:
            name: spire-agent
        - name: trust-bundle
          configMap:
            name: spire-trust-bundle
        - name: data
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        - name: agent-socket
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        - name: plugins
          emptyDir:
            sizeLimit: 128Mi
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
        - name: api-token
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 600
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
              - downwardAPI:
                  items:
                    - path: namespace
                      fieldRef:
                        fieldPath: metadata.namespace
      shareProcessNamespace: true
      initContainers:
        - name: install-agent-plugin
          image: localhost:5001/cluster-jwt-agent@sha256:stub
          args:
            - install
            - /run/spire/plugins
          securityContext:
            runAsUser: 1001
            runAsGroup: 1001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - name: plugins
              mountPath: /run/spire/plugins
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: celld-token
  namespace: cell-identity-system
  labels:
    cell.poc.internal/harness: cell-identity
rules:
  - apiGroups:
      - ""
    resources:
      - serviceaccounts/token
    resourceNames:
      - celld
    verbs:
      - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: celld-token
  namespace: cell-identity-system
  labels:
    cell.poc.internal/harness: cell-identity
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: celld-token
subjects:
  - kind: ServiceAccount
    name: celld
    namespace: cell-identity-system
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: spire-agent
  namespace: cell-identity-system
  labels:
    cell.poc.internal/harness: cell-identity
data:
  agent.conf: |-
    # SPIRE agent of the environment trust domain. It runs as a sidecar in the celld pod.
    # render.sh replaces the @SPIRE_*@ tokens, and hydrate replaces @CELL_NAME@.
    # The agent checks that the server presents spiffe://dev.env.poc.internal/spire/server, and it
    # trusts only the roots in the trust bundle file, so it sends a token to no other server.
    agent {
      data_dir = "/run/spire/data"
      log_level = "INFO"
      log_format = "json"
      server_address = "10.9.0.9"
      server_port = 30081
      socket_path = "/run/spire/agent/agent.sock"
      trust_bundle_path = "/run/spire/bundle/bundle.crt"
      trust_domain = "dev.env.poc.internal"
    }

    plugins {
      # The data directory is a memory volume of the pod. A restarted agent container keeps its key
      # and SVID there. A new pod attests again as a new agent, with a new nonce.
      KeyManager "disk" {
        plugin_data {
          directory = "/run/spire/data"
        }
      }

      NodeAttestor "cluster_jwt" {
        plugin_cmd = "/run/spire/plugins/cluster-jwt-agent"
        plugin_checksum = "721e788273376452df6f39e42f7221d50bc210263bb44c9290f77668dede750f"
        plugin_data {
          cell = "@CELL_NAME@"
          env = "dev"
        }
      }

      # The pod shares one process namespace, so the agent reads the uid of celld from /proc.
      WorkloadAttestor "unix" {
        plugin_data {}
      }
    }
---
