apiVersion: apps/v1
kind: Deployment
metadata: {name: istiod, namespace: istio-system}
spec:
  selector: {matchLabels: {app: istiod}}
  template:
    metadata:
      labels: {app: istiod}
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      containers: [{name: istiod, image: "registry.invalid/istiod:1"}]
