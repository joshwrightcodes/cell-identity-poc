apiVersion: batch/v1
kind: CronJob
metadata: {name: demo, namespace: argocd}
spec:
  schedule: "0 * * * *"
  jobTemplate:
    spec:
      template:
        metadata:
          labels: {sidecar.istio.io/inject: "true"}
        spec:
          restartPolicy: Never
          containers: [{name: demo, image: "registry.invalid/demo:1"}]
