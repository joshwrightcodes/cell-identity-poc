apiVersion: apps/v1
kind: Deployment
metadata: {name: bypass, namespace: apps-demo}
spec:
  selector: {matchLabels: {app: bypass}}
  template:
    metadata:
      labels: {app: bypass}
      annotations:
        traffic.sidecar.istio.io/excludeOutboundIPRanges: "0.0.0.0/0"
    spec:
      containers: [{name: bypass, image: "registry.invalid/bypass:1"}]
