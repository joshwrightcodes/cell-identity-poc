apiVersion: apps/v1
kind: Deployment
metadata: {name: bypass, namespace: apps-sample}
spec:
  selector: {matchLabels: {app: bypass}}
  template:
    metadata:
      labels: {app: bypass}
      annotations:
        proxy.istio.io/config: '{"interceptionMode": "NONE"}'
    spec:
      containers: [{name: bypass, image: "registry.invalid/bypass:1"}]
