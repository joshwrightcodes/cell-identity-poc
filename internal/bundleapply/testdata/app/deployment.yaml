apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo
  namespace: apps-sample
spec:
  replicas: 1
  selector:
    matchLabels: {app: demo}
  template:
    metadata:
      labels: {app: demo}
      annotations:
        sidecar.istio.io/inject: "true"
    spec:
      containers:
        - name: demo
          image: registry.invalid/demo:1
