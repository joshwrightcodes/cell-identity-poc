# The five kind clusters of the PoC. Subnets must not overlap each other,
# the kind network or the Lima host network. See internal/topology.
nodeImage: docker.io/kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
clusters:
  - name: management
    podSubnet: 10.10.0.0/16
    serviceSubnet: 10.110.0.0/16
    issuer: https://management.issuer.poc.internal
    components: [base-cell, external-secrets, spire-server, observability-store, mgmt-plane, central-view, telemetry-gateway, mesh-view-hub]
  - name: dev-cp
    podSubnet: 10.11.0.0/16
    serviceSubnet: 10.111.0.0/16
    issuer: https://dev-cp.issuer.poc.internal
    components: [base-cell, external-secrets, spire-server, relay-system, telemetry-uplink]
  - name: dev-cell-1
    podSubnet: 10.20.0.0/16
    serviceSubnet: 10.120.0.0/16
    issuer: https://dev-cell-1.issuer.poc.internal
    components: [base-cell, cell-identity, argocd-agent, otel-uplink, mesh-view]
  - name: dev-cell-2
    podSubnet: 10.21.0.0/16
    serviceSubnet: 10.121.0.0/16
    issuer: https://dev-cell-2.issuer.poc.internal
    components: [base-cell, cell-identity, argocd-agent, otel-uplink, mesh-view]
  - name: rogue
    podSubnet: 10.30.0.0/16
    serviceSubnet: 10.130.0.0/16
    issuer: https://rogue.issuer.poc.internal
    components: []
