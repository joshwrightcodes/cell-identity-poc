# Tools and tasks for the cell PoC. `mise install` installs every tool, and `mise run <task>`
# puts these versions first on PATH. kind runs its clusters in the Colima VM that `vm:up` starts.

[settings]
# mise.lock pins each tool with its checksum. Run `mise lock` after a version change.
lockfile_platforms = ["macos-arm64", "linux-x64"]

[tools]
colima = "0.10.3"
lima = "2.3.0"
docker-cli = "29.9.3"
kubectl = "1.37.2"
helm = "4.3.1"
kustomize = "5.8.3"
oras = "1.3.6"
yq = "4.54.2"
jq = "1.8.2"
kind = "0.33.0"
# Keep the same version as ARGOCD_VERSION in cells/common.env.
argocd = "3.6.1"
go = "1.27.3"
ko = "0.19.1"
# Mac-only tools. conftest runs the bundle policy over the renders, and cosign checks a signed bundle set.
conftest = "0.71.1"
cosign = "3.1.4"

[env]
# CELL picks the cluster. The default is dev-cell-1. An unknown name fails in scripts/lib.sh.
CELL = "{{get_env(name='CELL', default='dev-cell-1')}}"
_.file = ["cells/common.env", "cells/{{get_env(name='CELL', default='dev-cell-1')}}.env"]
# vendor/ holds reviewed third-party manifests, not Go modules. Make Go ignore it.
GOFLAGS = "-mod=readonly"
# Every Docker and kind command talks to the PoC VM, whatever the current Docker context is.
DOCKER_HOST = "unix://{{env.HOME}}/.colima/poc/docker.sock"
# ko builds images for this platform, and scripts/deps-check.sh checks the module rules for the same platform.
KO_DEFAULTPLATFORMS = "linux/arm64"

[tasks."vm:up"]
description = "Start the Colima VM that runs the kind clusters"
run = [
  "colima start --profile poc --vm-type vz --cpu 14 --memory 40 --disk 120 --runtime docker",
  # Five kind nodes need more inotify instances than the default of 128. The setting resets on VM restart.
  "colima ssh --profile poc -- sudo sysctl -w fs.inotify.max_user_instances=1024 fs.inotify.max_user_watches=1048576",
]

[tasks."vm:down"]
description = "Stop the Colima VM. kind clusters stop with it"
run = "colima stop --profile poc"

[tasks."cell:up"]
description = "Create the cluster through the host service, apply the bootstrap set, publish every bundle, wait for Argo CD at the published revisions, then apply the harness components"
depends = ["vm:up"]
run = "scripts/up.sh"

[tasks."cell:hydrate"]
description = "Render every component into build/<cluster>/bundles/<component>/manifests.yaml"
run = "scripts/hydrate.sh"

[tasks."cell:publish"]
description = "Push the hydrated bundles to the in-cluster store and point the root bundle at their digests. A cluster whose bundle state has source signed refuses this task, unless BUNDLE_PUBLISH_UNSIGNED=1 (break glass); use bundle -- publish there"
run = "scripts/publish.sh"

[tasks."cell:verify"]
description = "Run the checks of the cluster CELL: the base cell rules, and the identity, secret store and SPIRE server checks of its component sets. Prints PASS or FAIL for each"
run = "scripts/verify.sh"

[tasks."cell:ui"]
description = "Serve the Argo CD UI on http://localhost:8080 from this Mac. The UI lists only the root Application, so the task prints the child Applications first"
run = "scripts/ui.sh"

[tasks."cell:ui:clean"]
description = "Remove what the server of cell:ui wrote into argocd: the initial admin Secret and the admin and signing keys of argocd-secret. Safe to run again"
run = "scripts/ui.sh --clean"

[tasks."cell:restart"]
description = "Restart the harness Deployments of the cluster CELL, so that each SPIRE agent attests again. STORE_TOKENS=1 also restarts bundle-store-0 and argocd-repo-server, which rotates the projected store tokens. In dev-cp and management, restart the SPIRE server"
run = "scripts/restart.sh"

[tasks."cell:restart-mesh"]
description = "Start the sidecars of the cluster CELL again: delete the pods of every Deployment in each injected namespace, wait for new Ready pods, and check that each istio-proxy has the cell name as ISTIO_META_CLUSTER_ID. Prints one JSON line"
run = "scripts/restart-mesh.sh"

[tasks."cell:link"]
description = "Run the link phase of the cluster CELL (default management): render each link component with the live facts of the other clusters, apply it, run its Jobs and wait for its rollouts"
env = { CELL = "{{get_env(name='CELL', default='management')}}" }
run = "scripts/link.sh"

[tasks."view:ui"]
description = "Serve the read-only central Argo CD UI of management on http://127.0.0.1:8090"
env = { CELL = "management" }
run = "scripts/view-ui.sh"

[tasks."mesh:ui"]
description = "Serve the read-only Kiali mesh view of management on http://127.0.0.1:20001/kiali"
env = { CELL = "management" }
run = "scripts/mesh-ui.sh"

[tasks."mesh:status"]
description = "Report the mesh view of management: the tunnel of each cell at the hub, the tunnel pod in each cell, and Kiali. Exit status 1 when a part is not up"
env = { CELL = "management" }
run = "scripts/mesh-status.sh"

[tasks."view:rotate-keys"]
description = "Make new view keys in management: new agent CA and certificates, JWT key and server key, a new central Redis password, then restart argocd-redis, argocd-repo-server, the principal and argocd-server"
env = { CELL = "management" }
run = "scripts/view-rotate-keys.sh"

[tasks."obs:ui"]
description = "Serve Grafana of management on http://127.0.0.1:${OBS_UI_PORT:-3300}. Print the admin password with obs:password. The task prints one JSON line and exits when the port is busy"
env = { CELL = "management" }
run = "scripts/obs-ui.sh"

[tasks."obs:password"]
description = "Print the Grafana admin password of management on standard output, for a pipe to the clipboard. The task writes no file"
env = { CELL = "management" }
run = "scripts/obs-password.sh"

[tasks."obs:rotate-password"]
description = "Rotate the Grafana admin password of management through the Grafana API, replace Secret grafana-admin, and check the new and the old password"
env = { CELL = "management" }
run = "scripts/obs-rotate-password.sh"

[tasks."obs:uplink-status"]
description = "Report each hop of the telemetry path of one cluster: its collector queue and failures, the uplink, the gateway counts for that sender, and the newest sample in the store. Prints one JSON object that names the first failing hop"
usage = 'arg "<cluster>"'
run = 'scripts/uplink-status.sh ${usage_cluster?}'

[tasks."cell:down"]
description = "Delete the cluster through the host service"
run = "scripts/down.sh"

[tasks.test]
description = "Run the Go unit tests, or the packages given after --"
usage = 'arg "[packages]..." var=#true default="./..."'
# The go test timeout is 20 minutes for each package. test/scripts took 541 s (559 s on a loaded run) on 2026-11-17, and the default of 10 minutes was too close. The CI job runs this task, so it has the same timeout.
run = 'eval go test -timeout 20m ${usage_packages?}'

[tasks.lint]
description = "Run go vet on every package, and on the end-to-end tests with the e2e build tag. Then check the module rules of each binary in cmd/ with scripts/deps-check.sh"
run = ["go vet ./...", "go vet -tags e2e ./test/e2e/", "scripts/deps-check.sh"]

[tasks."vendor:fetch"]
description = "Download the pinned Argo CD manifest, Istio charts and External Secrets Operator chart into vendor/ for review"
run = "scripts/vendor-fetch.sh"

[tasks."secrets:connect"]
description = "Apply the token Secret and SecretStore poc-secrets in each store namespace of the cluster CELL (default dev-cp), from the settings in .envrc.local"
# The cluster with the secret store is the default here, not dev-cell-1.
env = { CELL = "{{get_env(name='CELL', default='dev-cp')}}" }
run = "scripts/secrets-connect.sh"

[tasks."eso:migrate"]
description = "Move a live CELL (default dev-cp) from the cluster-scoped External Secrets Operator to the one scoped to its store namespace. Safe to run again"
env = { CELL = "{{get_env(name='CELL', default='dev-cp')}}" }
run = "scripts/eso-migrate.sh"

[tasks."pki:rotate-intermediate"]
description = "Sign a new intermediate CA, write it to the secret manager, sync it with secrets:connect, restart the SPIRE server of CELL (default dev-cp) and check its CA"
env = { CELL = "{{get_env(name='CELL', default='dev-cp')}}" }
run = "scripts/pki-rotate-intermediate.sh"

[tasks.hostsvc]
description = "Run the host service: up, down or facts (facts --cluster <name>, or facts --registry for the address of the registry mirror), with the arguments after --"
run = "go run ./cmd/hostsvc"

[tasks.bundlectl]
description = "Run bundlectl, which packs, pushes and composes bundle sets on this Mac: set, push, bootstrap, push-root, compose, attach, projects or pubkey-pem, with the arguments after --"
run = "go run ./cmd/bundlectl"

[tasks.bundle]
description = "Publish and repair signed bundle sets of a cell or dev-cp, with the arguments after --: publish --target <cluster>... [--wait] signs and pushes the hydrated set, get --target <cluster> prints the last signed set, cosign --target <cluster> attaches the Sigstore bundle that mgmtd holds now (after a key rotation), verify --target <cluster> checks with cosign, offline, that mgmtd signed the root of the state, repair --target <cluster> is the break glass that applies the argocd and cell-system bundles of the last good set"
run = "scripts/bundle.sh"

[tasks."hostsvc:serve"]
description = "Run the host service on this Mac, which answers the key requests and the spec pushes of mgmtd and the step requests of the cell controller on 127.0.0.1:17443. The argument is start, stop, restart (stop, start, then the link of mgmt-api), status, pin, sync (write the dev root and the keys after the cross-check with mgmtd), steps [--reset], log --step <id> [--follow] or cancel --cell <c> | --step <id>. start and restart refuse while a step runs a stage, unless --force"
env = { CELL = "management" }
run = "scripts/hostsvc-serve.sh"

[tasks.mgmt]
description = "Run mgmtd ctl in the pod mgmtd-0 of management, with the arguments after --: status, records, pubkey, keys, keycheck, revoke, unrevoke, restore or rotate-key, reset-state to start with a new state and a new signing key, or rotate-signing-key to rotate the signing key and render it"
env = { CELL = "management" }
run = "scripts/mgmt.sh"

[tasks."harness:up"]
description = "Check the tool versions, create management, dev-cp and rogue through the host service, build the images, then run cell:up on each of them that has components. The two cells have no cell:up: the task asks for them with portal -- request, and waits with portal -- wait until both are valid. cell:up of dev-cp connects the secret store, or asks for secrets:connect in a second shell. The last step runs bundle -- publish --wait for dev-cp and both cells, so each of them applies a signed bundle set"
depends = ["harness:preflight"]
run = "scripts/harness.sh up"

[tasks."harness:verify"]
description = "Run cell:verify on every cluster that has components, and print one PASS or FAIL line for each"
run = "scripts/harness-verify.sh"

[tasks."harness:status"]
description = "Report whether the PoC is healthy. Print one JSON object for each cluster with components: Applications, cell:verify, telemetry, and for management the agents, the Prometheus samples, Kiali and the mesh view. Exit status 1 when a value is bad"
env = { CELL = "management" }
run = "scripts/status.sh"

[tasks."harness:logs"]
description = "Print the JSON log lines of the pods that match a label selector, each with the field cluster. The first argument is a cluster or all. For example: mise run harness:logs all app.kubernetes.io/name=argocd-agent-principal"
usage = '''
arg "<cluster>" help="A cluster with components, or all"
arg "<selector>" help="A label selector"
'''
run = 'scripts/logs.sh "${usage_cluster?}" "${usage_selector?}"'

[tasks."harness:down"]
description = "Delete all five clusters through the host service"
run = "scripts/harness.sh down"

[tasks.images]
description = "Build and push the in-cluster images to the local registry at localhost:5001, and record their digests in build/images.env"
depends = ["vm:up"]
# Without VCS stamps, a binary changes only when its sources change, so a commit alone gives no new digests.
env = { KO_DOCKER_REPO = "localhost:5001", GOFLAGS = "-mod=readonly -buildvcs=false" }
run = "scripts/images.sh"

[tasks."gate:m1"]
description = "Run the M1 end-to-end tests, plus the go test arguments after --"
depends = ["images"]
run = "scripts/gate.sh m1"

[tasks."gate:m2"]
description = "Run the M2 end-to-end tests against the SPIRE server in dev-cp, plus the go test arguments after --"
depends = ["images"]
run = "scripts/gate.sh m2"

[tasks."gate:m3"]
description = "Run the M3 end-to-end tests against the management plane and dev-cp, plus the go test arguments after --"
depends = ["images"]
run = "scripts/gate.sh m3"

[tasks."gate:m3:repair"]
description = "Delete the objects and the firewall rules on the dev-cp node that a gate:m3 run left when it stopped before its cleanups. With --check, only list them. Safe to run again"
run = "scripts/gate-m3-repair.sh"

[tasks."gate:m4"]
description = "Run the M4 end-to-end tests against the management plane stand-in, envd and the cells, plus the go test arguments after --. The task builds no image: run mise run images first, or mise run images -- <name> for one image"
run = "scripts/gate.sh m4"

[tasks."gate:m4:rotate"]
description = "Run the test that rotates the signing key of mgmtd and renders the new key into envd and the SPIRE server of dev-cp, plus the go test arguments after --. It prints the attestation gap. Run it alone, after gate:m4"
run = "scripts/gate.sh m4-rotate"

[tasks."gate:m4:repair"]
description = "Start the host service again and link mgmt-api when the pin or the root drifted, set the replicas of mgmtd and envd back to 1, serve the latest spec again, delete the test namespaces and Jobs of gate:m4, and run gate:m2:repair. With --check, only report, and fail with the repair command. Safe to run again"
run = "scripts/gate-m4-repair.sh"

[tasks."gate:m5"]
description = "Run the M5 end-to-end tests against the management plane stand-in, envd, the cell gateway and the cells, plus the go test arguments after --. It runs gate:m5:repair --check first, and checks the deployed images of mgmtd, envd and cellgw. The task builds no image: run mise run images first, or mise run images -- <name> for one image"
run = "scripts/gate.sh m5"

[tasks."gate:m5:soak"]
description = "Run the test that sends an operation to dev-cell-1 each minute for 30 minutes, applies each once, keeps the gap between enqueue and claim below 15 s, and records the reconnect count, plus the go test arguments after --. It runs the checks of gate:m5 first. Run it alone, after gate:m5. The task builds no image: run mise run images first"
run = "scripts/gate.sh m5-soak"

[tasks."gate:m5:drill"]
description = "Run the test that loses the volume of the cell gateway with an operation in flight, runs gw:reset, and checks that the operation is applied once and reported, plus the go test arguments after --. It runs the checks of gate:m5 first. It runs gw:reset on purpose. Run it alone, after gate:m5. The task builds no image: run mise run images first"
run = "scripts/gate.sh m5-drill"

[tasks."gate:m5:repair"]
description = "Run gate:m4:repair, set the replicas of the cell gateway and of celld back to 1, delete the test namespaces m5-* of every cluster, and check that each celld holds a stream at the gateway. With --check, only report, and fail with the repair command. Safe to run again"
run = "scripts/gate-m5-repair.sh"

[tasks.portal]
description = "The portal stand-in, with the arguments after --: request --cell <c>... [--wait], wait --cell <c>..., withdraw --cell <c>..., recreate --cell <c> [--wait], retry --cell <c> [--force] [--wait] or cancel --cell <c>. One command is one mgmtd ctl portal call and one commit. Prints one JSON line"
env = { CELL = "management" }
run = "scripts/portal.sh"

[tasks."gate:m6"]
description = "Run the M6 end-to-end tests against the management plane stand-in, the host service and the cells, plus the go test arguments after --. It runs gate:m6:repair --check first, and checks the deployed image of mgmtd. The task builds no image: run mise run images first, or mise run images -- <name> for one image"
run = "scripts/gate.sh m6"

[tasks."gate:m6:provision"]
description = "Run the test that deletes both cells and creates them again through the portal, checks 1 to 3 of the PoC from one request, plus the go test arguments after --. It runs gate:m6:repair --check first, and checks the deployed images of mgmtd, envd, the cell controller, cellgw and the SPIRE server. It deletes the cells on purpose, and writes build/gate/m6-provision, which gate:m6:repair uses to restore them after an interrupted run. The task builds no image: run mise run images first"
run = "scripts/gate.sh m6-provision"

[tasks."gate:m6:repair"]
description = "Run gate:m5:repair, run hostsvc:serve -- sync, cancel each open step that a gate test recorded in build/gate/m6-steps, and delete the test namespaces m6-* of every cluster. While build/gate/m6-provision exists, it also requests each cell that is not requested, waits until each cell is valid, links management and removes the marker. With --check, only report, also fail on an open step that no test recorded or on the marker, and fail with the repair command. Safe to run again"
run = "scripts/gate-m6-repair.sh"

[tasks."gate:m7"]
description = "Run the M7 end-to-end tests: a malicious cell, interception at each hop and a relay that alters bytes, plus the go test arguments after --. It runs gate:m7:repair --check first, and checks the deployed images of mgmtd, envd, the cell controller, cellgw, the SPIRE server and celld. The task builds no image: run mise run images first"
run = "scripts/gate.sh m7"

[tasks."gate:m7:repair"]
description = "Delete the test namespaces m7-* of every cluster, and wait until they are gone. With --check, only report and fail with the repair command. Safe to run again"
run = "scripts/gate-m7-repair.sh"

[tasks."gate:m8"]
description = "Run the M8 end-to-end tests: signed bundle sets that reach Argo CD in each cell and in dev-cp, refusals outside the allow list, and rollbacks, plus the go test arguments after --. The tests run with -short, which skips the long tests, unless GATE_M8_LONG=1. It runs gate:m7:repair --check and gate:m8:repair --check first, and checks the deployed images of the M7 gate and of cell-proxy in the bundle store and the repo server. It scans the logs for a token afterwards. The task builds no image: run mise run images first"
run = "scripts/gate.sh m8"

[tasks."gate:m8:repair"]
description = "Delete the namespaces m8-* and the Applications m8-* that a gate:m8 run left, run bundle -- repair for a target in rolled_back with rollback_unhealthy, and publish the hydrated set again for each target that a test changed (build/gate/m8-bundles, the Application apps-sample, the ConfigMap m8-marker in apps-sample or apps-demo, or the state rolled_back), dev-cp first. With --check, only report, and fail with the repair command. Safe to run again"
run = "scripts/gate-m8-repair.sh"

[tasks."gate:m9"]
description = "Run the slow tier of M9 overnight, plus the go test arguments after --. Phase 0 runs the repair checks of M6 to M9 and the image checks, keeps the Mac awake, refuses battery power unless GATE_ALLOW_BATTERY=1, and sets the SVID lifetime of dev-cp to GATE_M9_SVID_TTL. Then each M9 test runs in its own go test invocation, and the run stops at the first failure. Phase 7 restores the lifetime and runs harness:status, also after a failure. With -run, one invocation runs, and the run is not a record. The task builds no image: run mise run images first"
run = "scripts/gate.sh m9"

[tasks."gate:m9:repair"]
description = "Repair what a slow tier of gate:m9 left when it stopped early: heal every cut, wait until connected and until envd holds no local revocation entry, run revoke -- clean, un-revoke the test cells, repair the API server of a key rotation test, restore the SVID lifetime of dev-cp with a restart of each cluster, delete the namespaces m9-*, refill the bundle store of a cell that the store test left empty, and run harness:status. With --check, only list the traces, and fail with the repair command. Safe to run again"
run = "scripts/gate-m9-repair.sh"

[tasks."svid-ttl"]
description = "Switch the SVID lifetime of dev-cp for the slow tier, with the arguments after --: set <ttl> writes build/gate/m9-svid-ttl, runs cell:up of dev-cp and waits until every SVID has the lifetime; restore removes the marker, runs cell:up of dev-cp and cell:restart of dev-cp and each live cell, and waits; show prints the lifetimes. Each prints one JSON line. set and restore need dev-cp connected to management"
run = "scripts/svid-ttl.sh"

[tasks."poc:gate"]
description = "Run the gates as tiers, with the argument after --: fast runs gate:m1 to gate:m8 with gate:m6:provision and stops at the first failure, slow runs gate:m9, and all runs both. It keeps the Mac awake, and it refuses battery power unless GATE_ALLOW_BATTERY=1. The manual drills gate:m4:rotate, gate:m5:soak and gate:m5:drill do not run"
run = "scripts/poc-gate.sh"

[tasks.partition]
description = "Cut and heal the traffic between two kind clusters with tagged firewall rules, with the arguments after --: cut --from <cluster> --to <cluster> [--direction both|out|in] --hold <minutes> [--tag <tag>], heal --tag <tag>, heal --all (every gate-m9-cut- rule on every existing cluster) or list. A cut covers the IPv4 and the IPv6 address of the peer, and a timer in the node removes each rule after the hold plus 15 minutes. It prints one JSON line"
run = "scripts/partition.sh"

[tasks.gw]
description = "Run cellgw ctl in the pod cell-gateway-0 of dev-cp, with the arguments after --: status, queue --cell <c>, enqueue --cell <c> [--replay], inject or outbox. Standard input reaches enqueue and inject"
env = { CELL = "dev-cp" }
run = "scripts/gw.sh"

[tasks.ops]
description = "Look at signed work, with the arguments after --: trace <id> prints the operation at mgmtd and its rows in the gateway queue, and close <id> closes an open or expired operation with a refusal that mgmtd signs"
env = { CELL = "dev-cp" }
run = "scripts/ops.sh"

[tasks."gw:reset"]
description = "Break-glass: start the cell gateway with an empty store. Set its replicas to 0, delete the volume claim store-cell-gateway-0, set the replicas to 1, wait for Ready and for the first sync of envd, and print one JSON line with the old and the new epoch"
env = { CELL = "dev-cp" }
run = "scripts/gw-reset.sh"

[tasks."mgmt:rotate-ca"]
description = "Replace the CA of the SPIRE server in CELL (default management) with a new root: prepare, refresh every peer copy, activate, revoke the old root, refresh again"
env = { CELL = "{{get_env(name='CELL', default='management')}}" }
run = "scripts/mgmt-rotate-ca.sh"

[tasks."gate:m2:repair"]
description = "Repair dev-cp and dev-cell-1 after any gate:m2 run that stopped before its cleanups. Safe to run again"
run = "scripts/gate-m2-repair.sh"

[tasks."harness:preflight"]
description = "Check the tool versions and the Colima profile against harness/versions.env"
depends = ["vm:up"]
run = "scripts/preflight.sh"

[tasks."harness:size"]
description = "Print the memory and CPU of every kind node container and the registry"
run = "scripts/size.sh"

[tasks."harness:restart-check"]
description = "Stop and start the VM, wait for Ready nodes, then run the M1 gate. The clusters do not survive the restart, so this check leaves the harness broken. Rebuild it afterwards with harness:down and harness:up"
run = "scripts/restart-check.sh"

[tasks.pki]
description = "Print CA material: root, intermediate (root bundle on stdin), key or cert (bundle on stdin), trust-bundle (checks PEM certificates) or info (one certificate). See cmd/pkigen"
run = "go run ./cmd/pkigen"

[tasks.operatorctl]
description = "Run operatorctl, the operator key tool of this Mac, with the arguments after --: keygen --public-file <path>, pub, sign --env <e> --cell <c> --record <epoch>.<counter> or verify --keys <file>. The seed moves only through standard input and standard output. See cmd/operatorctl"
run = "go run ./cmd/operatorctl"

[tasks.revoke]
description = "Revoke a cell with the operator key, with the arguments after --: local --cell <cell> (sign an entry for the record that envd holds and write it to envd-system/local-revocations), list (each entry with its envd state), reapply (write build/operator/revocations.log back) or clean (delete the stale and settled entries). Prints JSON lines. See scripts/revoke.sh"
run = "scripts/revoke.sh"

[tasks."operator:create-key"]
description = "Owner action, once: write a new operator key to the secret manager through POC_SECRET_WRITE_CMD, read it back, then write ConfigMap mgmt-system/operator-pub and build/operator/key.env. See scripts/operator-key.sh"
run = "scripts/operator-key.sh create"

[tasks."operator:check-key"]
description = "Read the operator key through POC_SECRET_READ_CMD and compare its public key with operator-pub, each pin in dev-cp and build/operator/key.env. Prints one JSON line with match"
run = "scripts/operator-key.sh check"

[tasks."operator:rotate-key"]
description = "Rotate the operator key, with the overlap of two keys, or at once with -- --emergency. Refuses while not connected, during a cut or a slow tier, and while envd holds a local revocation entry"
run = "scripts/operator-key.sh rotate"
