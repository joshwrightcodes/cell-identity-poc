# Tools and tasks for the cell PoC. `mise run <task>` puts these versions first on PATH.
# Tools that Homebrew provides: mise itself and Apple `container` 1.6.1 or later.

[settings]
# mise.lock pins each tool with its checksum. Run `mise lock` after a version change.
lockfile_platforms = ["macos-arm64", "linux-x64"]

[tools]
kubectl = "1.37.2"
helm = "4.3.1"
kustomize = "5.8.3"
oras = "1.3.6"
yq = "4.54.2"
jq = "1.8.2"
# Keep the same version as ARGOCD_VERSION in cell.env.
argocd = "3.6.1"

[env]
_.file = "cell.env"

[tasks."cell:up"]
description = "Create the cluster, apply the bootstrap set, publish every bundle and wait for Argo CD"
run = "scripts/up.sh"

[tasks."cell:hydrate"]
description = "Render every component into build/bundles/<component>/manifests.yaml"
run = "scripts/hydrate.sh"

[tasks."cell:publish"]
description = "Push the hydrated bundles to the in-cluster store and point the root bundle at their digests"
run = "scripts/publish.sh"

[tasks."cell:verify"]
description = "Run the base cell checks and print PASS or FAIL for each"
run = "scripts/verify.sh"

[tasks."cell:ui"]
description = "Serve the Argo CD UI on http://localhost:8080 from this Mac, with no UI in the cluster"
run = 'argocd admin dashboard --context "$CELL_NAME" --namespace argocd --address 127.0.0.1 --port 8080'

[tasks."cell:down"]
description = "Delete the cluster"
run = "scripts/down.sh"

[tasks."vendor:fetch"]
description = "Download the pinned Argo CD manifest and Istio charts into vendor/ for review"
run = "scripts/vendor-fetch.sh"
