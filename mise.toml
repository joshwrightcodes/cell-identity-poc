# Tools and tasks for the cell PoC. `mise install` installs every tool, and `mise run <task>`
# puts these versions first on PATH. kind runs its clusters in the Colima VM that `vm:up` starts.

[settings]
# mise.lock pins each tool with its checksum. Run `mise lock` after a version change.
lockfile_platforms = ["macos-arm64", "linux-x64"]

[tools]
colima = "0.10.3"
lima = "2.3.0"
docker-cli = "29.9.3"
kubectl = "1.37.2"
helm = "4.3.1"
kustomize = "5.8.3"
oras = "1.3.6"
yq = "4.54.2"
jq = "1.8.2"
kind = "0.33.0"
# Keep the same version as ARGOCD_VERSION in cells/common.env.
argocd = "3.6.1"
go = "1.27.3"
ko = "0.19.1"

[env]
# CELL picks the cluster. The default is dev-cell-1. An unknown name fails in scripts/lib.sh.
CELL = "{{get_env(name='CELL', default='dev-cell-1')}}"
_.file = ["cells/common.env", "cells/{{get_env(name='CELL', default='dev-cell-1')}}.env"]
# vendor/ holds reviewed third-party manifests, not Go modules. Make Go ignore it.
GOFLAGS = "-mod=readonly"
# Every Docker and kind command talks to the PoC VM, whatever the current Docker context is.
DOCKER_HOST = "unix://{{env.HOME}}/.colima/poc/docker.sock"

[tasks."vm:up"]
description = "Start the Colima VM that runs the kind clusters"
run = [
  "colima start --profile poc --vm-type vz --cpu 14 --memory 40 --disk 120 --runtime docker",
  # Five kind nodes need more inotify instances than the default of 128. The setting resets on VM restart.
  "colima ssh --profile poc -- sudo sysctl -w fs.inotify.max_user_instances=1024 fs.inotify.max_user_watches=1048576",
]

[tasks."vm:down"]
description = "Stop the Colima VM. kind clusters stop with it"
run = "colima stop --profile poc"

[tasks."cell:up"]
description = "Create the cluster through the host service, apply the bootstrap set, publish every bundle, wait for Argo CD at the published revisions, then apply the harness components"
depends = ["vm:up"]
run = "scripts/up.sh"

[tasks."cell:hydrate"]
description = "Render every component into build/<cluster>/bundles/<component>/manifests.yaml"
run = "scripts/hydrate.sh"

[tasks."cell:publish"]
description = "Push the hydrated bundles to the in-cluster store and point the root bundle at their digests"
run = "scripts/publish.sh"

[tasks."cell:verify"]
description = "Run the checks of the cluster CELL: the base cell rules, and the identity, secret store and SPIRE server checks of its component sets. Prints PASS or FAIL for each"
run = "scripts/verify.sh"

[tasks."cell:ui"]
description = "Serve the Argo CD UI on http://localhost:8080 from this Mac. The UI lists only the root Application, so the task prints the child Applications first"
run = "scripts/ui.sh"

[tasks."cell:ui:clean"]
description = "Remove what the server of cell:ui wrote into argocd: the initial admin Secret and the admin and signing keys of argocd-secret. Safe to run again"
run = "scripts/ui.sh --clean"

[tasks."cell:restart"]
description = "Restart the harness Deployments of the cluster CELL, so that each SPIRE agent attests again. In dev-cp and management, restart the SPIRE server"
run = "scripts/restart.sh"

[tasks."cell:restart-mesh"]
description = "Start the sidecars of the cluster CELL again: delete the pods of every Deployment in each injected namespace, wait for new Ready pods, and check that each istio-proxy has the cell name as ISTIO_META_CLUSTER_ID. Prints one JSON line"
run = "scripts/restart-mesh.sh"

[tasks."cell:link"]
description = "Run the link phase of the cluster CELL (default management): render each link component with the live facts of the other clusters, apply it, run its Jobs and wait for its rollouts"
env = { CELL = "{{get_env(name='CELL', default='management')}}" }
run = "scripts/link.sh"

[tasks."view:ui"]
description = "Serve the read-only central Argo CD UI of management on http://127.0.0.1:8090"
env = { CELL = "management" }
run = "scripts/view-ui.sh"

[tasks."mesh:ui"]
description = "Serve the read-only Kiali mesh view of management on http://127.0.0.1:20001/kiali"
env = { CELL = "management" }
run = "scripts/mesh-ui.sh"

[tasks."mesh:status"]
description = "Report the mesh view of management: the tunnel of each cell at the hub, the tunnel pod in each cell, and Kiali. Exit status 1 when a part is not up"
env = { CELL = "management" }
run = "scripts/mesh-status.sh"

[tasks."view:rotate-keys"]
description = "Make new view keys in management: new agent CA and certificates, JWT key and server key, a new central Redis password, then restart argocd-redis, argocd-repo-server, the principal and argocd-server"
env = { CELL = "management" }
run = "scripts/view-rotate-keys.sh"

[tasks."obs:ui"]
description = "Serve Grafana of management on http://127.0.0.1:${OBS_UI_PORT:-3300}. Print the admin password with obs:password. The task prints one JSON line and exits when the port is busy"
env = { CELL = "management" }
run = "scripts/obs-ui.sh"

[tasks."obs:password"]
description = "Print the Grafana admin password of management on standard output, for a pipe to the clipboard. The task writes no file"
env = { CELL = "management" }
run = "scripts/obs-password.sh"

[tasks."obs:rotate-password"]
description = "Rotate the Grafana admin password of management through the Grafana API, replace Secret grafana-admin, and check the new and the old password"
env = { CELL = "management" }
run = "scripts/obs-rotate-password.sh"

[tasks."obs:uplink-status"]
description = "Report each hop of the telemetry path of one cluster: its collector queue and failures, the uplink, the gateway counts for that sender, and the newest sample in the store. Prints one JSON object that names the first failing hop"
usage = 'arg "<cluster>"'
run = 'scripts/uplink-status.sh ${usage_cluster?}'

[tasks."cell:down"]
description = "Delete the cluster through the host service"
run = "scripts/down.sh"

[tasks.test]
description = "Run the Go unit tests, or the packages given after --"
usage = 'arg "[packages]..." var=#true default="./..."'
run = 'eval go test ${usage_packages?}'

[tasks.lint]
description = "Run go vet on every package, and on the end-to-end tests with the e2e build tag"
run = ["go vet ./...", "go vet -tags e2e ./test/e2e/"]

[tasks."vendor:fetch"]
description = "Download the pinned Argo CD manifest, Istio charts and External Secrets Operator chart into vendor/ for review"
run = "scripts/vendor-fetch.sh"

[tasks."secrets:connect"]
description = "Apply the token Secret and SecretStore poc-secrets in each store namespace of the cluster CELL (default dev-cp), from the settings in .envrc.local"
# The cluster with the secret store is the default here, not dev-cell-1.
env = { CELL = "{{get_env(name='CELL', default='dev-cp')}}" }
run = "scripts/secrets-connect.sh"

[tasks."eso:migrate"]
description = "Move a live CELL (default dev-cp) from the cluster-scoped External Secrets Operator to the one scoped to its store namespace. Safe to run again"
env = { CELL = "{{get_env(name='CELL', default='dev-cp')}}" }
run = "scripts/eso-migrate.sh"

[tasks."pki:rotate-intermediate"]
description = "Sign a new intermediate CA, write it to the secret manager, sync it with secrets:connect, restart the SPIRE server of CELL (default dev-cp) and check its CA"
env = { CELL = "{{get_env(name='CELL', default='dev-cp')}}" }
run = "scripts/pki-rotate-intermediate.sh"

[tasks.hostsvc]
description = "Run the host service: up, down or facts, with the arguments after --"
run = "go run ./cmd/hostsvc"

[tasks."hostsvc:serve"]
description = "Run the host service on this Mac, which answers the key requests of mgmtd on 127.0.0.1:17443. The argument is start, stop, restart (stop, start, then the link of mgmt-api), status or pin"
env = { CELL = "management" }
run = "scripts/hostsvc-serve.sh"

[tasks.mgmt]
description = "Run mgmtd ctl in the pod mgmtd-0 of management, with the arguments after --: status, records, pubkey, keys, keycheck, restore or rotate-key, reset-state to start with a new state and a new signing key, or rotate-signing-key to rotate the signing key and render it"
env = { CELL = "management" }
run = "scripts/mgmt.sh"

[tasks."harness:up"]
description = "Check the tool versions, create all five clusters through the host service, build the images, then run cell:up on each cluster that has components. cell:up of dev-cp connects the secret store, or asks for secrets:connect in a second shell"
depends = ["harness:preflight"]
run = "scripts/harness.sh up"

[tasks."harness:verify"]
description = "Run cell:verify on every cluster that has components, and print one PASS or FAIL line for each"
run = "scripts/harness-verify.sh"

[tasks."harness:status"]
description = "Report whether the PoC is healthy. Print one JSON object for each cluster with components: Applications, cell:verify, telemetry, and for management the agents, the Prometheus samples, Kiali and the mesh view. Exit status 1 when a value is bad"
env = { CELL = "management" }
run = "scripts/status.sh"

[tasks."harness:logs"]
description = "Print the JSON log lines of the pods that match a label selector, each with the field cluster. The first argument is a cluster or all. For example: mise run harness:logs all app.kubernetes.io/name=argocd-agent-principal"
usage = '''
arg "<cluster>" help="A cluster with components, or all"
arg "<selector>" help="A label selector"
'''
run = 'scripts/logs.sh "${usage_cluster?}" "${usage_selector?}"'

[tasks."harness:down"]
description = "Delete all five clusters through the host service"
run = "scripts/harness.sh down"

[tasks.images]
description = "Build and push the in-cluster images to the local registry at localhost:5001, and record their digests in build/images.env"
depends = ["vm:up"]
# Without VCS stamps, a binary changes only when its sources change, so a commit alone gives no new digests.
env = { KO_DOCKER_REPO = "localhost:5001", KO_DEFAULTPLATFORMS = "linux/arm64", GOFLAGS = "-mod=readonly -buildvcs=false" }
run = "scripts/images.sh"

[tasks."gate:m1"]
description = "Run the M1 end-to-end tests, plus the go test arguments after --"
depends = ["images"]
run = "scripts/gate.sh m1"

[tasks."gate:m2"]
description = "Run the M2 end-to-end tests against the SPIRE server in dev-cp, plus the go test arguments after --"
depends = ["images"]
run = "scripts/gate.sh m2"

[tasks."gate:m3"]
description = "Run the M3 end-to-end tests against the management plane and dev-cp, plus the go test arguments after --"
depends = ["images"]
run = "scripts/gate.sh m3"

[tasks."gate:m3:repair"]
description = "Delete the objects and the firewall rules on the dev-cp node that a gate:m3 run left when it stopped before its cleanups. With --check, only list them. Safe to run again"
run = "scripts/gate-m3-repair.sh"

[tasks."gate:m4"]
description = "Run the M4 end-to-end tests against the management plane stand-in, envd and the cells, plus the go test arguments after --. The task builds no image: run mise run images first, or mise run images -- <name> for one image"
run = "scripts/gate.sh m4"

[tasks."gate:m4:rotate"]
description = "Run the test that rotates the signing key of mgmtd and renders the new key into envd and the SPIRE server of dev-cp, plus the go test arguments after --. It prints the attestation gap. Run it alone, after gate:m4"
run = "scripts/gate.sh m4-rotate"

[tasks."gate:m4:repair"]
description = "Start the host service again and link mgmt-api when the pin or the root drifted, set the replicas of mgmtd and envd back to 1, serve the latest spec again, delete the test namespaces and Jobs of gate:m4, and run gate:m2:repair. With --check, only report, and fail with the repair command. Safe to run again"
run = "scripts/gate-m4-repair.sh"

[tasks."gate:m5"]
description = "Run the M5 end-to-end tests against the management plane stand-in, envd, the cell gateway and the cells, plus the go test arguments after --. It runs gate:m5:repair --check first, and checks the deployed images of mgmtd, envd and cellgw. The task builds no image: run mise run images first, or mise run images -- <name> for one image"
run = "scripts/gate.sh m5"

[tasks."gate:m5:soak"]
description = "Run the test that sends an operation to dev-cell-1 each minute for 30 minutes, applies each once, keeps the gap between enqueue and claim below 15 s, and records the reconnect count, plus the go test arguments after --. It runs the checks of gate:m5 first. Run it alone, after gate:m5. The task builds no image: run mise run images first"
run = "scripts/gate.sh m5-soak"

[tasks."gate:m5:repair"]
description = "Run gate:m4:repair, set the replicas of the cell gateway back to 1, and delete the test namespaces m5-* of every cluster. With --check, only report, and fail with the repair command. Safe to run again"
run = "scripts/gate-m5-repair.sh"

[tasks.gw]
description = "Run cellgw ctl in the pod cell-gateway-0 of dev-cp, with the arguments after --: status, queue --cell <c>, enqueue --cell <c> [--replay], inject or outbox. Standard input reaches enqueue and inject"
env = { CELL = "dev-cp" }
run = "scripts/gw.sh"

[tasks."gw:reset"]
description = "Break-glass: start the cell gateway with an empty store. Set its replicas to 0, delete the volume claim store-cell-gateway-0, set the replicas to 1, wait for Ready and for the first sync of envd, and print one JSON line with the old and the new epoch"
env = { CELL = "dev-cp" }
run = "scripts/gw-reset.sh"

[tasks."mgmt:rotate-ca"]
description = "Replace the CA of the SPIRE server in CELL (default management) with a new root: prepare, refresh every peer copy, activate, revoke the old root, refresh again"
env = { CELL = "{{get_env(name='CELL', default='management')}}" }
run = "scripts/mgmt-rotate-ca.sh"

[tasks."gate:m2:repair"]
description = "Repair dev-cp and dev-cell-1 after any gate:m2 run that stopped before its cleanups. Safe to run again"
run = "scripts/gate-m2-repair.sh"

[tasks."harness:preflight"]
description = "Check the tool versions and the Colima profile against harness/versions.env"
depends = ["vm:up"]
run = "scripts/preflight.sh"

[tasks."harness:size"]
description = "Print the memory and CPU of every kind node container and the registry"
run = "scripts/size.sh"

[tasks."harness:restart-check"]
description = "Stop and start the VM, wait for Ready nodes, then run the M1 gate. The clusters do not survive the restart, so this check leaves the harness broken. Rebuild it afterwards with harness:down and harness:up"
run = "scripts/restart-check.sh"

[tasks.pki]
description = "Print CA material: root, intermediate (root bundle on stdin), key or cert (bundle on stdin), trust-bundle (checks PEM certificates) or info (one certificate). See cmd/pkigen"
run = "go run ./cmd/pkigen"
