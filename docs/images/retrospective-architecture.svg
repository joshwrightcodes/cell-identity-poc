<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 676" width="900" height="676" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Architecture of the cell identity PoC</title>
  <desc id="d">Architecture. Cells attest to the dev-cp SPIRE server and stream to the cell gateway. envd pulls signed work from mgmtd. Cell uplinks reach the central views through a passthrough relay. mgmtd and the cell controller call the host service on the Mac, which stands in for the cloud provider.</desc>
  <rect x="0" y="0" width="900" height="676" fill="#ffffff"/>
        <defs>
          <marker id="up" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b6b62"/></marker>
          <marker id="side" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9a4a07"/></marker>
        </defs>

        
        <rect x="20" y="16" width="684" height="124" rx="4" fill="#e7eef6"/>
        <rect x="20" y="16" width="684" height="124" rx="4" fill="none" stroke="#2c4a6e" stroke-width="1"/>
        <text x="34" y="38" font-size="13" font-weight="700" fill="#2c4a6e">management</text>
        <text x="128" y="38" font-size="11" fill="#2c4a6e">mgmt.poc.internal · self-signed root, key on disk</text>
        <rect x="40" y="56" width="260" height="62" rx="3" fill="#ffffff" stroke="#c9d3d0"/>
        <text x="54" y="82" font-size="13" font-weight="700" fill="#15211f">mgmtd</text>
        <text x="54" y="102" font-size="11" fill="#55625f">signs specs, work, steps and bundle sets</text>
        <rect x="330" y="56" width="360" height="62" rx="3" fill="#ffffff" stroke="#c9d3d0"/>
        <text x="344" y="82" font-size="13" font-weight="700" fill="#15211f">Central views</text>
        <text x="344" y="102" font-size="11" fill="#55625f">Argo CD principal · telemetry gateway · Kiali hub</text>

        
        <rect x="20" y="230" width="684" height="130" rx="4" fill="#e7eef6"/>
        <rect x="20" y="230" width="684" height="130" rx="4" fill="none" stroke="#2c4a6e" stroke-width="1"/>
        <text x="34" y="252" font-size="13" font-weight="700" fill="#2c4a6e">dev-cp</text>
        <text x="104" y="252" font-size="11" fill="#2c4a6e">dev.env.poc.internal · intermediate from an offline root</text>
        <rect x="40" y="270" width="110" height="62" rx="3" fill="#ffffff" stroke="#c9d3d0"/>
        <text x="52" y="296" font-size="13" font-weight="700" fill="#15211f">envd</text>
        <text x="52" y="316" font-size="11" fill="#55625f">spec and work</text>
        <rect x="165" y="270" width="150" height="62" rx="3" fill="#ffffff" stroke="#c9d3d0"/>
        <text x="177" y="296" font-size="13" font-weight="700" fill="#15211f">SPIRE server</text>
        <text x="177" y="316" font-size="11" fill="#55625f">cluster_jwt plugin</text>
        <rect x="330" y="270" width="120" height="62" rx="3" fill="#ffffff" stroke="#c9d3d0"/>
        <text x="342" y="296" font-size="13" font-weight="700" fill="#15211f">cell gateway</text>
        <text x="342" y="316" font-size="11" fill="#55625f">queue and outbox</text>
        <rect x="465" y="270" width="110" height="62" rx="3" fill="#ffffff" stroke="#c9d3d0"/>
        <text x="477" y="296" font-size="13" font-weight="700" fill="#15211f">relays</text>
        <text x="477" y="316" font-size="11" fill="#55625f">TLS passthrough</text>
        <rect x="590" y="270" width="100" height="62" rx="3" fill="#ffffff" stroke="#c9d3d0"/>
        <text x="600" y="296" font-size="13" font-weight="700" fill="#15211f">cell</text>
        <text x="600" y="316" font-size="11" fill="#55625f">controller</text>

        
        <rect x="20" y="448" width="684" height="150" rx="4" fill="#e7eef6"/>
        <rect x="20" y="448" width="684" height="150" rx="4" fill="none" stroke="#2c4a6e" stroke-width="1"/>
        <text x="34" y="470" font-size="13" font-weight="700" fill="#2c4a6e">dev-cell-1, dev-cell-2</text>
        <text x="190" y="470" font-size="11" fill="#2c4a6e">SVIDs from dev.env.poc.internal · own mesh CA per cell</text>
        <rect x="40" y="500" width="110" height="62" rx="3" fill="#ffffff" stroke="#c9d3d0"/>
        <text x="52" y="526" font-size="13" font-weight="700" fill="#15211f">Argo CD</text>
        <text x="52" y="546" font-size="11" fill="#55625f">core, bundle store</text>
        <rect x="165" y="500" width="150" height="62" rx="3" fill="#ffffff" stroke="#c9d3d0"/>
        <text x="177" y="526" font-size="13" font-weight="700" fill="#15211f">spire-agent sidecar</text>
        <text x="177" y="546" font-size="11" fill="#55625f">non-reattestable</text>
        <rect x="330" y="500" width="120" height="62" rx="3" fill="#ffffff" stroke="#c9d3d0"/>
        <text x="342" y="526" font-size="13" font-weight="700" fill="#15211f">celld</text>
        <text x="342" y="546" font-size="11" fill="#55625f">claims signed work</text>
        <rect x="465" y="500" width="110" height="62" rx="3" fill="#ffffff" stroke="#c9d3d0"/>
        <text x="477" y="526" font-size="13" font-weight="700" fill="#15211f">cell-proxy</text>
        <text x="477" y="546" font-size="11" fill="#55625f">view, OTLP, tunnel</text>

        
        <rect x="730" y="250" width="150" height="100" rx="3" fill="#f7e7d6" stroke="#9a4a07" stroke-width="1"/>
        <text x="742" y="274" font-size="13" font-weight="700" fill="#15211f">host service</text>
        <text x="742" y="292" font-size="11" fill="#55625f">on the Mac, stands in</text>
        <text x="742" y="307" font-size="11" fill="#55625f">for the cloud provider:</text>
        <text x="742" y="322" font-size="11" fill="#55625f">clusters, JWKS, steps</text>
        <rect x="730" y="500" width="150" height="62" rx="3" fill="#f7e7d6" stroke="#9a4a07" stroke-width="1"/>
        <text x="742" y="526" font-size="13" font-weight="700" fill="#15211f">registry mirror</text>
        <text x="742" y="546" font-size="11" fill="#55625f">bundle bytes by digest</text>

        
        <line x1="95" y1="270" x2="95" y2="121" fill="none" stroke="#0b6b62" stroke-width="2" marker-end="url(#up)"/>
        <text x="102" y="172" font-size="11" fill="#15211f">pull signed spec and work</text>
        <text x="102" y="187" font-size="11" fill="#15211f">report with cell proof</text>

        <line x1="240" y1="500" x2="240" y2="335" fill="none" stroke="#0b6b62" stroke-width="2" marker-end="url(#up)"/>
        <text x="247" y="404" font-size="11" fill="#15211f">attest: cell token</text>
        <text x="247" y="419" font-size="11" fill="#15211f">vs signed keys</text>

        <line x1="390" y1="500" x2="390" y2="335" fill="none" stroke="#0b6b62" stroke-width="2" marker-end="url(#up)"/>
        <text x="397" y="404" font-size="11" fill="#15211f">mTLS stream</text>
        <text x="397" y="419" font-size="11" fill="#15211f">+ proof token</text>

        <line x1="520" y1="500" x2="520" y2="335" fill="none" stroke="#0b6b62" stroke-width="2" marker-end="url(#up)"/>
        <text x="527" y="404" font-size="11" fill="#15211f">SVID mTLS</text>
        <text x="527" y="419" font-size="11" fill="#15211f">+ proof frame</text>
        <line x1="520" y1="270" x2="520" y2="121" fill="none" stroke="#0b6b62" stroke-width="2" marker-end="url(#up)"/>
        <text x="527" y="172" font-size="11" fill="#15211f">view, telemetry,</text>
        <text x="527" y="187" font-size="11" fill="#15211f">mesh tunnel</text>

        
        <polyline points="250,118 250,212 805,212 805,248" fill="none" stroke="#9a4a07" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#side)"/>
        <text x="600" y="206" font-size="11" fill="#15211f">JWKS over pinned TLS</text>
        <line x1="690" y1="301" x2="728" y2="301" fill="none" stroke="#9a4a07" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#side)"/>
        <text x="709" y="290" font-size="10" text-anchor="middle" fill="#55625f">steps</text>
        <line x1="575" y1="584" x2="805" y2="584" fill="none" stroke="#9a4a07" stroke-width="1.6" stroke-dasharray="5 4"/>
        <line x1="805" y1="584" x2="805" y2="564" fill="none" stroke="#9a4a07" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#side)"/>
        <text x="600" y="578" font-size="11" fill="#15211f">fetch by digest</text>
      
  <line x1="20" y1="640" x2="864" y2="640" stroke="#d5dedb"/>
  <line x1="24" y1="660" x2="64" y2="660" stroke="#0b6b62" stroke-width="2" marker-end="url(#up)"/>
  <text x="74" y="664" font-size="12" fill="#15211f">SPIFFE identity, from caller to server</text>
  <line x1="320" y1="660" x2="360" y2="660" stroke="#9a4a07" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#side)"/>
  <text x="370" y="664" font-size="12" fill="#15211f">call to the Mac, in place of the cloud provider</text>
  <rect x="660" y="652" width="14" height="14" fill="#e7eef6" stroke="#2c4a6e"/>
  <text x="682" y="664" font-size="12" fill="#15211f">cluster and trust domain</text>
