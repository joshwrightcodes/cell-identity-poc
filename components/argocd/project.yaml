# The only project that Applications use in a cluster with role open. Sources are the local store only,
# read through the token client in the repo server pod (127.0.0.1:5000), and the only destination is this cluster.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: cell
spec:
  description: Base cell components, applied from the in-cluster bundle store
  sourceRepos:
    - oci://127.0.0.1:5000/bundles/*
  destinations:
    - server: https://kubernetes.default.svc
      namespace: "*"
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
