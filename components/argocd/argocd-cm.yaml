apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cm
data:
  # Report the health of child Applications, so sync waves in the root Application wait for them.
  resource.customizations.health.argoproj.io_Application: |
    hs = {}
    hs.status = "Progressing"
    hs.message = ""
    if obj.status ~= nil and obj.status.health ~= nil then
      hs.status = obj.status.health.status
      if obj.status.health.message ~= nil then
        hs.message = obj.status.health.message
      end
    end
    return hs
  timeout.reconciliation: 60s
  # The server of argocd admin dashboard writes an admin password unless admin is off.
  admin.enabled: "false"
