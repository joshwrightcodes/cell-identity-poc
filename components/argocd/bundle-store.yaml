# Credential template for every bundle in the in-cluster store. It holds no credential: it only tells
# Argo CD to use plain HTTP. The host is the token client in the repo server pod (container store-token),
# which adds the token of the pod and sends the request to the bundle store.
apiVersion: v1
kind: Secret
metadata:
  name: bundle-store
  labels:
    argocd.argoproj.io/secret-type: repo-creds
stringData:
  type: oci
  url: oci://127.0.0.1:5000/bundles
  insecureOCIForceHttp: "true"
