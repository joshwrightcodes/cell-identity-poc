# Child Applications live in argocd-apps, and the central view mirrors that namespace. A Secret there
# would put a credential in the namespace that the mirror reads, so the namespace admits none, for
# every user.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: argocd-apps-no-secrets
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["secrets"]
  validations:
    - expression: "false"
      message: The namespace argocd-apps holds no Secret
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: argocd-apps-no-secrets
spec:
  policyName: argocd-apps-no-secrets
  validationActions: [Deny]
  matchResources:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: argocd-apps
---
# The central view mirrors only argocd-apps, and Argo CD exempts its own namespace from the
# sourceNamespaces of a project. So argocd holds only the root Application, and each Application in
# argocd-apps uses the project cell, for every user. An Application elsewhere would run unseen by
# the view.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: argocd-apps-cell-project
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["argoproj.io"]
        apiVersions: ["*"]
        operations: ["CREATE", "UPDATE"]
        resources: ["applications"]
  validations:
    - expression: "request.namespace != 'argocd' || object.metadata.name == 'root'"
      message: The namespace argocd holds only the root Application
      reason: Forbidden
    - expression: "object.spec.project == 'cell'"
      message: An Application in argocd or argocd-apps uses the project cell
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: argocd-apps-cell-project
spec:
  policyName: argocd-apps-cell-project
  validationActions: [Deny]
  matchResources:
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: In
          values: [argocd, argocd-apps]
