# The server of argocd admin dashboard creates AppProject default with every source, destination and
# kind when none exists. This project allows nothing, so Applications cannot use it.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: default
spec:
  description: Allows nothing. Applications use the project cell
  sourceRepos: []
  destinations: []
  clusterResourceWhitelist: []
  namespaceResourceWhitelist: []
