# The Argo CD Agent of a cell lists and watches every Secret in argocd, because it cannot start
# without that access. The agent sends no Secret to the central view, and its Role has no get verb.
# This policy keeps the set of Secrets in argocd closed, for every user. A new Secret in argocd
# needs a change to this list.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: argocd-secrets-allowed
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["secrets"]
  validations:
    - expression: "object.metadata.name in ['argocd-redis', 'argocd-secret', 'bundle-store']"
      message: The namespace argocd admits only the Secrets argocd-redis, argocd-secret and bundle-store
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: argocd-secrets-allowed
spec:
  policyName: argocd-secrets-allowed
  validationActions: [Deny]
  matchResources:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: argocd
---
# The central view mirrors the Applications of argocd. Each Application there uses the project
# cell or the project cell-app, for every user, so no Application can use a project with wider rights.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: argocd-cell-project
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["argoproj.io"]
        apiVersions: ["*"]
        operations: ["CREATE", "UPDATE"]
        resources: ["applications"]
  validations:
    - expression: "object.spec.project in ['cell', 'cell-app']"
      message: An Application in argocd uses the project cell or cell-app
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: argocd-cell-project
spec:
  policyName: argocd-cell-project
  validationActions: [Deny]
  matchResources:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: argocd
