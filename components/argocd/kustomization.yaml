# Argo CD core install: no UI, no API server and no remote cluster secrets.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: argocd
resources:
  - ../../vendor/argocd/v3.6.1
  - bundle-store.yaml
  - project.yaml
patches:
  - path: argocd-cm.yaml
  - path: argocd-cmd-params-cm.yaml
