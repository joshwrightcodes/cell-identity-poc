# Argo CD core install: no UI, no API server and no remote cluster secrets.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: argocd
resources:
  - ../../vendor/argocd/v3.6.1
  - bundle-store.yaml
  - project.yaml
  - default-project.yaml
  - guards.yaml
patches:
  - path: argocd-cm.yaml
  - path: argocd-cmd-params-cm.yaml
  # The upstream policies admit every namespace on the metrics ports, and policies add up. Only the
  # collector of the cluster may scrape them (flow N15).
  - target:
      kind: NetworkPolicy
      name: argocd-application-controller-network-policy
    patch: |-
      - op: replace
        path: /spec/ingress/0/from
        value:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: observability-system
            podSelector:
              matchLabels:
                app.kubernetes.io/name: otel-collector
  - target:
      kind: NetworkPolicy
      name: argocd-repo-server-network-policy
    patch: |-
      - op: replace
        path: /spec/ingress/1/from
        value:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: observability-system
            podSelector:
              matchLabels:
                app.kubernetes.io/name: otel-collector
  # Only the pods of the namespace reach the ApplicationSet controller (webhook 7000, metrics 8080), through
  # the policy argocd.
  - target:
      kind: NetworkPolicy
      name: argocd-applicationset-controller-network-policy
    patch: |-
      $patch: delete
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: argocd-applicationset-controller-network-policy
