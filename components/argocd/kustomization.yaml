# Argo CD core install: no UI, no API server and no remote cluster secrets.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: argocd
resources:
  - ../../vendor/argocd/v3.6.1
  - bundle-store.yaml
  - project.yaml
  - apps-namespace-guard.yaml
patches:
  - path: argocd-cm.yaml
  - path: argocd-cmd-params-cm.yaml
  # The controller reads application.namespaces from argocd-cmd-params-cm at start. This checksum
  # of components/argocd/argocd-cmd-params-cm.yaml restarts it when that file changes.
  - target:
      kind: StatefulSet
      name: argocd-application-controller
    patch: |-
      - op: add
        path: /spec/template/metadata/annotations
        value:
          poc.internal/cmd-params-sha256: "63e5e990c0f99e172f5469c1c615951a33b70d256314b3a89a4cf2a6ac98d136"
