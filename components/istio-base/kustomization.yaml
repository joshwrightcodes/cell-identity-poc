# Istio CRDs and the default validation webhook.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
helmGlobals:
  chartHome: ../../vendor/charts/istio-1.30.8
helmCharts:
  - name: base
    releaseName: istio-base
    namespace: istio-system
    includeCRDs: true
    kubeVersion: "1.37.0"
    valuesFile: values.yaml
