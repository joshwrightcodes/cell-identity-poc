# Values for the vendored External Secrets Operator chart. The cell runs only the controller,
# and only for ExternalSecret and SecretStore objects in one namespace. render.sh sets that
# namespace, scopedNamespace, from SECRET_STORE_NAMESPACES. vendor/README.md records the review.
global:
  compatibility:
    openshift:
      adaptSecurityContext: disabled

image:
  tag: v2.14.0@sha256:10608eb53e636e744903d5f3657a4d9c44e28d9d9c181b73e07bc7dd2e6884dc

installCRDs: true
crds:
  createClusterExternalSecret: false
  createClusterGenerator: false
  createClusterPushSecret: false
  createClusterSecretStore: false
  createPushSecret: false
# Roles and a RoleBinding in scopedNamespace replace the ClusterRoles, and the controller watches
# only that namespace. The cluster store reconcilers stay off.
scopedRBAC: true
processClusterExternalSecret: false
processClusterGenerator: false
processClusterPushSecret: false
processClusterStore: false
processPushSecret: false
# The SecretStore reconciler sets the Ready condition of the store.
processSecretStore: true
openshiftFinalizers: false

rbac:
  serviceAccountTokenCreate: false
  leaderElection:
    create: false
  servicebindings:
    create: false
  aggregateToView: false
  aggregateToEdit: false
  aggregateToAdmin: false

# The webhook only validates objects, and the cert controller only serves the webhook. The
# controller does not need either of them.
webhook:
  create: false
certController:
  create: false

log:
  timeEncoding: iso8601

# Address 0 closes the health listener, which no probe uses.
extraArgs:
  live-addr: "0"

resources:
  requests:
    cpu: 20m
    memory: 128Mi
  limits:
    memory: 512Mi
