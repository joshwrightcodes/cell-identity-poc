# The mesh-view tunnel of a cell: cell-proxy in tunnel mode with a cluster_jwt SPIRE agent sidecar.
# render.sh fills in the @...@ values, and components/lib/spire-sidecar.sh adds the SPIRE agent. The
# SVID of the sidecar is spiffe://dev.env.poc.internal/cell/<cell>/mesh-view.
#
# cell-proxy dials the relay of dev-cp with SPIFFE mTLS, and accepts only the exact server ID
# spiffe://mgmt.poc.internal/kiali, chained to the roots in ConfigMap mgmt-root. It serves the
# requests that arrive through the tunnel to the Kubernetes API of the cell, with the token of its
# own pod. The allow-list of the tunnel and the ClusterRole mesh-view-read both limit those
# requests to reads of the kinds that Kiali shows. The default token mount stays off, and the
# cell-proxy container mounts the token as a projected volume. The SPIRE agent sidecar mounts a token of
# the same ServiceAccount too (components/lib/spire-sidecar.sh), for its cluster_jwt plugin. The guard
# mesh-view-read-only (guard.yaml) limits what that token can create.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mesh-view
  namespace: mesh-view-system
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mesh-view
  namespace: mesh-view-system
  labels:
    app.kubernetes.io/name: mesh-view
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: mesh-view
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mesh-view
      annotations:
        poc.internal/peer-root-sha256: "@PEER_ROOT_SHA256@"
    spec:
      serviceAccountName: mesh-view
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        # The mesh-view entry selects unix:uid:65532, the user of the ko base image.
        - name: cell-proxy
          image: "@CELL_PROXY_IMAGE@"
          args:
            - tunnel
            - "--upstream=@UPSTREAM@"
            - --expect-id=spiffe://mgmt.poc.internal/kiali
            - --peer-bundle=/run/cell-proxy/mgmt-root/root.crt
            - --peer-trust-domain=mgmt.poc.internal
            # A dead path ends the tunnel after 15 seconds, well inside one SVID life of 1 minute.
            - --read-idle=10s
            - --ping-timeout=5s
            - --proof
          env:
            - name: SPIFFE_ENDPOINT_SOCKET
              value: unix:///run/spire/agent/agent.sock
            - name: OTEL_SERVICE_NAME
              value: cell-proxy-mesh-tunnel
            # Each pod gets its own metric series, so a counter that starts again after a restart
            # never continues the series of the pod before it.
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: service.instance.id=$(POD_NAME)
            - name: POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: SERVICE_ACCOUNT
              valueFrom:
                fieldRef:
                  fieldPath: spec.serviceAccountName
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector.observability-system.svc.cluster.local:4317
          # The tunnel serves its own state on 127.0.0.1:18099, and mise run mesh:status reads it with
          # cell-proxy tunnel-status. The probes run whoami, which asks the Workload API for the SVIDs of the pod, so
          # a SPIRE agent that stops serves no identity and restarts the container. They do not read the tunnel
          # state: a cell that starts before the hub has no tunnel, and it must still become Ready.
          startupProbe:
            exec:
              command: [/ko-app/cell-proxy, whoami]
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec:
              command: [/ko-app/cell-proxy, whoami]
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: [/ko-app/cell-proxy, whoami]
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 4
          securityContext:
            runAsUser: 65532
            runAsGroup: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: spire-agent-socket
              mountPath: /run/spire/agent
              readOnly: true
            - name: mgmt-root
              mountPath: /run/cell-proxy/mgmt-root
              readOnly: true
            - name: kube-api-access
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
      volumes:
        - name: mgmt-root
          configMap:
            name: mgmt-root
        - name: kube-api-access
          projected:
            defaultMode: 0444
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 3600
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
              - downwardAPI:
                  items:
                    - path: namespace
                      fieldRef:
                        fieldPath: metadata.namespace
---
# The kinds that the tunnel allow-list of cell-proxy admits, as get, list and watch. A render test
# compares these rules with the allow-list (cellproxy.ReadResources), so the two cannot differ. The
# ClusterRole holds no ConfigMap and no Secret: Role mesh-view-read in istio-system grants ConfigMaps
# there alone.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: mesh-view-read
rules:
  - apiGroups: [""]
    resources: [namespaces, pods, replicationcontrollers, services]
    verbs: [get, list, watch]
  - apiGroups: [admissionregistration.k8s.io]
    resources: [mutatingwebhookconfigurations]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [daemonsets, deployments, replicasets, statefulsets]
    verbs: [get, list, watch]
  - apiGroups: [batch]
    resources: [cronjobs, jobs]
    verbs: [get, list, watch]
  - apiGroups: [extensions.istio.io]
    resources: [trafficextensions, wasmplugins]
    verbs: [get, list, watch]
  - apiGroups: [gateway.networking.k8s.io]
    resources: [gatewayclasses, gateways, grpcroutes, httproutes, referencegrants, tcproutes, tlsroutes, udproutes]
    verbs: [get, list, watch]
  - apiGroups: [inference.networking.k8s.io]
    resources: [inferencepools]
    verbs: [get, list, watch]
  - apiGroups: [networking.istio.io]
    resources: [destinationrules, envoyfilters, gateways, serviceentries, sidecars, virtualservices, workloadentries, workloadgroups]
    verbs: [get, list, watch]
  - apiGroups: [security.istio.io]
    resources: [authorizationpolicies, peerauthentications, requestauthentications]
    verbs: [get, list, watch]
  - apiGroups: [telemetry.istio.io]
    resources: [telemetries]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: mesh-view-read
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: mesh-view-read
subjects:
  - kind: ServiceAccount
    name: mesh-view
    namespace: mesh-view-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mesh-view-read
  namespace: istio-system
rules:
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mesh-view-read
  namespace: istio-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: mesh-view-read
subjects:
  - kind: ServiceAccount
    name: mesh-view
    namespace: mesh-view-system
