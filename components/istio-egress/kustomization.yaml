# The egress gateway and the allowed external hosts. Mesh traffic to an external host
# leaves through this gateway. NetworkPolicy lets only the gateway reach the internet.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
helmGlobals:
  chartHome: ../../vendor/charts/istio-1.30.8
helmCharts:
  - name: gateway
    releaseName: istio-egressgateway
    namespace: istio-egress
    kubeVersion: "1.37.0"
    valuesFile: values.yaml
resources:
  - allowed-hosts.yaml
