# The cell identity stub: celld with a SPIRE agent sidecar. render.sh fills in the celld image and
# the network peers, and components/lib/spire-sidecar.sh adds the agent, its token Role and its
# ConfigMaps. The agent attests to the SPIRE server of the environment with the cluster_jwt
# plugin, and celld gets its X.509 SVID from the agent.
# The namespace stays out of the mesh, so identity does not depend on Istio.
apiVersion: v1
kind: Namespace
metadata:
  name: cell-identity-system
  labels:
    istio-injection: disabled
    pod-security.kubernetes.io/enforce: restricted
---
# The pod mounts no token for this account. Only the agent container and the celld container get a
# projected API token, each from its own volume.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: celld
  namespace: cell-identity-system
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: celld
  namespace: cell-identity-system
  labels:
    app.kubernetes.io/name: celld
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: celld
  template:
    metadata:
      labels:
        app.kubernetes.io/name: celld
      annotations:
        poc.internal/peer-root-sha256: "@PEER_ROOT_SHA256@"
    spec:
      serviceAccountName: celld
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        # The celld entry selects unix:uid:65532, the user of the ko base image.
        - name: celld
          image: "@CELLD_IMAGE@"
          # celld binds the cell issuer to the management plane through relay-bind in the environment
          # control plane. It asks for a token of its own account, bound to this pod, and sends it with
          # the keys of the cell.
          args:
            - --cell=@CELL_NAME@
            - --bind-upstream=@BIND_UPSTREAM@
            - --bind-expect-id=spiffe://mgmt.poc.internal/api
            - --bind-peer-bundle=/run/celld/mgmt-root/root.crt
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: SERVICE_ACCOUNT
              valueFrom:
                fieldRef:
                  fieldPath: spec.serviceAccountName
            - name: SPIFFE_ENDPOINT_SOCKET
              value: unix:///run/spire/agent/agent.sock
            - name: OTEL_SERVICE_NAME
              value: celld
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector.observability-system.svc.cluster.local:4317
          securityContext:
            runAsUser: 65532
            runAsGroup: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - name: agent-socket
              mountPath: /run/spire/agent
              readOnly: true
            - name: mgmt-root
              mountPath: /run/celld/mgmt-root
              readOnly: true
            - name: celld-api-token
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
      volumes:
        - name: mgmt-root
          configMap:
            name: mgmt-root
        - name: celld-api-token
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 3600
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
              - downwardAPI:
                  items:
                    - path: namespace
                      fieldRef:
                        fieldPath: metadata.namespace
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: cell-identity-system
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
# celld resolves the collector name, so the namespace needs DNS.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: cell-identity-system
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
        - ipBlock:
            cidr: "@DNS_SERVICE_IP@/32"
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
# The pod reaches only the SPIRE server node port and the relay-bind node port in the environment
# control plane, the API server for TokenRequest, and the collector. It accepts no connections: the
# probes run in the pod.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: celld
  namespace: cell-identity-system
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: celld
  policyTypes: [Ingress, Egress]
  egress:
    - to:
        - ipBlock:
            cidr: "@SPIRE_SERVER_ADDRESS@/32"
      ports:
        - protocol: TCP
          port: 30081
        - protocol: TCP
          port: 30447
    - to: "@API_SERVER_PEERS@"
      ports:
        - protocol: TCP
          port: "@API_SERVER_PORT@"
    - to:
        - ipBlock:
            cidr: "@API_SERVICE_IP@/32"
      ports:
        - protocol: TCP
          port: 443
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: otel-collector
      ports:
        - protocol: TCP
          port: 4317
