# The cell identity stub: celld with a SPIRE agent sidecar. render.sh fills in the celld image and
# the network peers, and components/lib/spire-sidecar.sh adds the agent, its token Role and its
# ConfigMaps. The agent attests to the SPIRE server of the environment with the cluster_jwt
# plugin, and celld gets its X.509 SVID from the agent.
# The namespace stays out of the mesh, so identity does not depend on Istio.
# celld also applies the signed bundle sets of its cell. It reads them from the registry mirror, writes them to the bundle store
# with a projected token of the audience bundle-store, and asks Argo CD for the state of the Applications. Role celld-argocd
# and ClusterRole celld-netpol-read give the rights that the apply engine needs. The guards bundles-spare-harness and
# bundles-app-limits come from components/lib/bundle-guard.sh.
apiVersion: v1
kind: Namespace
metadata:
  name: cell-identity-system
  labels:
    istio-injection: disabled
    pod-security.kubernetes.io/enforce: restricted
---
# The pod mounts no token for this account. Only the agent container and the celld container get a
# projected API token, each from its own volume.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: celld
  namespace: cell-identity-system
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: celld
  namespace: cell-identity-system
  labels:
    app.kubernetes.io/name: celld
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: celld
  template:
    metadata:
      labels:
        app.kubernetes.io/name: celld
      annotations:
        poc.internal/trust-bundle-sha256: "@TRUST_BUNDLE_SHA256@"
        poc.internal/op-key-sha256: "@OP_KEY_SHA256@"
    spec:
      serviceAccountName: celld
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        # The celld entry selects unix:uid:65532, the user of the ko base image.
        - name: celld
          image: "@CELLD_IMAGE@"
          # celld binds the cell issuer to the management plane and claims signed operations through the
          # cell gateway in the environment control plane. It loads the trust bundle and the operation
          # keys only at start, so each mount has a checksum annotation on the pod template.
          args:
            - --cell=@CELL_NAME@
            - --env=@POC_ENV@
            - --gateway=@GATEWAY_STREAM@
            - --gateway-bind=@GATEWAY_BIND@
            - --gateway-id=spiffe://dev.env.poc.internal/cp/gateway
            - --trust-bundle=/run/celld/trust-bundle/bundle.crt
            - --op-key-dir=/run/celld/op-key
            - --ops-namespace=cell-ops-system
            - --bundle-mirror=@REGISTRY_ADDRESS@
            - --bundle-store=bundle-store.cell-system.svc.cluster.local:5000
            - --bundle-store-token=/var/run/secrets/bundle-store/token
            - --bundle-health-timeout=5m
            - --bundle-refill-every=60s
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: SERVICE_ACCOUNT
              valueFrom:
                fieldRef:
                  fieldPath: spec.serviceAccountName
            - name: SPIFFE_ENDPOINT_SOCKET
              value: unix:///run/spire/agent/agent.sock
            - name: OTEL_SERVICE_NAME
              value: celld
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector.observability-system.svc.cluster.local:4317
          securityContext:
            runAsUser: 65532
            runAsGroup: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: agent-socket
              mountPath: /run/spire/agent
              readOnly: true
            - name: spire-trust-bundle
              mountPath: /run/celld/trust-bundle
              readOnly: true
            - name: mgmt-op-key
              mountPath: /run/celld/op-key
              readOnly: true
            - name: celld-api-token
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
            - name: bundle-store-token
              mountPath: /var/run/secrets/bundle-store
              readOnly: true
      volumes:
        - name: spire-trust-bundle
          configMap:
            name: spire-trust-bundle
        - name: mgmt-op-key
          configMap:
            name: mgmt-op-key
        # The bundle store accepts this token only for the audience bundle-store, and only from the account celld.
        - name: bundle-store-token
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  audience: bundle-store
                  expirationSeconds: 600
        - name: celld-api-token
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 3600
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
              - downwardAPI:
                  items:
                    - path: namespace
                      fieldRef:
                        fieldPath: metadata.namespace
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: cell-identity-system
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
# celld resolves the collector name, so the namespace needs DNS.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: cell-identity-system
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
        - ipBlock:
            cidr: "@DNS_SERVICE_IP@/32"
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
# The pod reaches only the SPIRE server node port, the stream and bind node ports of the cell gateway
# (flow N41), all in the environment control plane, the API server, and the collector. It also reads the
# bundle sets from the registry mirror (flow N45) and writes them to the bundle store (flow N46). It accepts
# no connections: the probes run in the pod.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: celld
  namespace: cell-identity-system
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: celld
  policyTypes: [Ingress, Egress]
  egress:
    - to:
        - ipBlock:
            cidr: "@SPIRE_SERVER_ADDRESS@/32"
      ports:
        - protocol: TCP
          port: 30081
    - to:
        - ipBlock:
            cidr: "@GATEWAY_ADDRESS@/32"
      ports:
        - protocol: TCP
          port: 30450
        - protocol: TCP
          port: 30451
    - to: "@API_SERVER_PEERS@"
      ports:
        - protocol: TCP
          port: "@API_SERVER_PORT@"
    - to:
        - ipBlock:
            cidr: "@API_SERVICE_IP@/32"
      ports:
        - protocol: TCP
          port: 443
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: otel-collector
      ports:
        - protocol: TCP
          port: 4317
    - to:
        - ipBlock:
            cidr: "@REGISTRY_IP@/32"
      ports:
        - protocol: TCP
          port: 5000
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cell-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: bundle-store
      ports:
        - protocol: TCP
          port: 5000
---
# The bundle store admits celld on port 5000. This policy is a harness plane policy: every pod of cell-system is
# selected, so a bundle cannot move the store out of the policy by a label, and the apply engine refuses a bundle
# that names this policy.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: plane-celld-store
  namespace: cell-system
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cell-identity-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: celld
      ports:
        - protocol: TCP
          port: 5000
---
# The operation records and the demo target of celld. The namespace holds no pod and stays out of the mesh.
apiVersion: v1
kind: Namespace
metadata:
  name: cell-ops-system
  labels:
    istio-injection: disabled
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: cell-ops-system
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
# celld keeps one record for each operation, and the demo log, as ConfigMaps in this namespace only.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: celld-ops
  namespace: cell-ops-system
rules:
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [create, get, list, update, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: celld-ops
  namespace: cell-ops-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: celld-ops
subjects:
  - kind: ServiceAccount
    name: celld
    namespace: cell-identity-system
---
# The apply engine of celld lists the Applications and asks Argo CD for a hard refresh of the Application root. On a
# rollback it terminates the running sync operation of root and of the component Applications. The render puts root and
# the components of the role in allow.json into resourceNames (components/lib/bundle-apps.sh). Nothing else in argocd.
# The right to patch also covers the spec of these Applications. That is no more than patch on root already gives,
# because root writes the spec of each component Application.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: celld-argocd
  namespace: argocd
rules:
  - apiGroups: [argoproj.io]
    resources: [applications]
    verbs: [list]
  - apiGroups: [argoproj.io]
    resources: [applications]
    resourceNames: "@ARGOCD_APPS@"
    verbs: [patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: celld-argocd
  namespace: argocd
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: celld-argocd
subjects:
  - kind: ServiceAccount
    name: celld
    namespace: cell-identity-system
---
# The engine reads the NetworkPolicies that carry the harness label in every namespace, so that no bundle blocks a plane flow.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: celld-netpol-read
rules:
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: [list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: celld-netpol-read
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: celld-netpol-read
subjects:
  - kind: ServiceAccount
    name: celld
    namespace: cell-identity-system
