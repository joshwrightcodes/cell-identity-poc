# The in-cluster OpenTelemetry collector. render.sh fills in the config and the image. The collector
# receives OTLP on 4317, scrapes the metrics endpoints of its own cluster, watches the Kubernetes
# events, sets the source attributes of the cluster on every signal, and exports through a
# persistent queue. It stays outside the mesh, because Envoy sends traces and access logs to it in
# plaintext, and it has no SPIRE sidecar: the uplink carries its signals out of the cluster.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: otel-collector
automountServiceAccountToken: false
---
# The prometheus receiver lists and watches pods to find its scrape targets, and the k8s_objects receiver
# lists and watches events. Nothing reads namespaces or one object by name.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: otel-collector
rules:
  - apiGroups: [""]
    resources: [pods, events]
    verbs: [list, watch]
  - apiGroups: [events.k8s.io]
    resources: [events]
    verbs: [list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: otel-collector
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: otel-collector
subjects:
  - kind: ServiceAccount
    name: otel-collector
    namespace: observability-system
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector
data:
  config.yaml: "@COLLECTOR_CONFIG@"
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: otel-collector
  labels:
    app.kubernetes.io/name: otel-collector
spec:
  serviceName: otel-collector
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: otel-collector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: otel-collector
    spec:
      serviceAccountName: otel-collector
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: otel-collector
          image: "@COLLECTOR_IMAGE@"
          args: ["--config", "/etc/otelcol/config.yaml"]
          # The Go runtime collects harder at 600 MiB, below the memory limit of 768Mi and above the
          # limit of the memory_limiter processor (512 MiB).
          env:
            - name: GOMEMLIMIT
              value: 600MiB
          ports:
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
          # The receiver opens 4317 after the pipelines start, so the probe covers them. The kubelet
          # reaches the port from a node address (flow N23).
          readinessProbe:
            tcpSocket:
              port: otlp-grpc
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket:
              port: otlp-grpc
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 768Mi
          volumeMounts:
            - name: config
              mountPath: /etc/otelcol
              readOnly: true
            - name: queue
              mountPath: /var/lib/otelcol
            # The receivers need an API token. Only this container mounts it.
            - name: api-token
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: otel-collector
        - name: api-token
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 3600
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
              - downwardAPI:
                  items:
                    - path: namespace
                      fieldRef:
                        fieldPath: metadata.namespace
  # The queue volume holds the file_storage queue and its compaction copy. The claim template is
  # immutable. README.md says how to resize the volume.
  volumeClaimTemplates:
    - metadata:
        name: queue
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  labels:
    app.kubernetes.io/name: otel-collector
spec:
  selector:
    app.kubernetes.io/name: otel-collector
  ports:
    - name: grpc-otlp
      port: 4317
      targetPort: otlp-grpc
      appProtocol: grpc
    - name: http-otlp
      port: 4318
      targetPort: otlp-http
      appProtocol: http
