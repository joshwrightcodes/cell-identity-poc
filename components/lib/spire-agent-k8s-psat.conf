# SPIRE agent for a plane workload. It runs as a sidecar in the @SPIRE_WORKLOAD@ pod and attests
# to the SPIRE server of its own cluster with k8s_psat. spire-sidecar.sh replaces the @SPIRE_*@ tokens.
# The agent checks that the server presents spiffe://@SPIRE_TRUST_DOMAIN@/spire/server, and it
# trusts only the roots in the trust bundle file, so it sends its token to no other server.
agent {
  data_dir = "/run/spire/data"
  log_level = "INFO"
  log_format = "json"
  server_address = "@SPIRE_SERVER_ADDRESS@"
  server_port = @SPIRE_SERVER_PORT@
  socket_path = "/run/spire/agent/agent.sock"
  trust_bundle_path = "/run/spire/bundle/bundle.crt"
  trust_domain = "@SPIRE_TRUST_DOMAIN@"
}

plugins {
  # The data directory is a memory volume of the pod. A restarted agent container keeps its key
  # and SVID there. A new pod attests again, and gets a new agent ID from its pod UID.
  KeyManager "disk" {
    plugin_data {
      directory = "/run/spire/data"
    }
  }

  # The token has the audience spire-server and lives at most 10 minutes. The server checks it with
  # TokenReview, and reads the pod and its node.
  NodeAttestor "k8s_psat" {
    plugin_data {
      cluster = "@SPIRE_CLUSTER@"
      token_path = "/var/run/secrets/tokens/spire-agent"
    }
  }

  # The pod shares one process namespace, so the agent reads the uid of each caller from /proc.
  WorkloadAttestor "unix" {
    plugin_data {}
  }
}
