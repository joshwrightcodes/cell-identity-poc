# The environment executor of dev-cp. render.sh fills in the @...@ values, adds the SPIRE agent sidecar
# (components/lib/spire-sidecar.sh) and the harness label, and prints the ConfigMaps and the
# NetworkPolicies.
#
# envd pulls the signed spec and the cell records from mgmtd, verifies them under the pinned
# management key, and writes them to ConfigMap spire-system/cell-records. The cluster_jwt plugin of the
# SPIRE server reads that ConfigMap. Its SVID is spiffe://dev.env.poc.internal/envd.
#
# envd also holds the local revocations that the operator key signs: it reads ConfigMap envd-system/local-revocations
# through Role envd-revocations and verifies each entry against the keys in ConfigMap envd-system/operator-key.
#
# It also writes the signed spec and the signed steps to ConfigMap cell-controller-system/cell-steps for the cell
# controller, and reads ConfigMap step-status there. The Role envd-steps, in the bundle of the cell controller, allows
# both, so that bundle must be applied first.
#
# envd also applies the signed bundle sets of dev-cp. It reads them from the registry mirror, writes them to the bundle store
# with a projected token of the audience bundle-store, keeps its state in ConfigMap envd-system/bundle-state, and asks
# Argo CD for the state of the Applications. Role envd-argocd, ClusterRole envd-netpol-read and Role envd-bundle-state
# give the rights that the apply engine needs. The guard bundles-spare-harness comes from components/lib/bundle-guard.sh.
apiVersion: v1
kind: Namespace
metadata:
  name: envd-system
  labels:
    istio-injection: disabled
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: envd
  namespace: envd-system
automountServiceAccountToken: false
---
# envd writes the records as ConfigMap cell-records in spire-system. Create cannot name the object,
# and get and update name only that one. envd calls Get, Create and Update on the ConfigMap, and Get
# on ConfigMap attest-hints, which it creates empty and the SPIRE server patches.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: envd-records
  namespace: spire-system
rules:
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [create]
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [cell-records]
    verbs: [get, update]
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [attest-hints]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: envd-records
  namespace: spire-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: envd-records
subjects:
  - kind: ServiceAccount
    name: envd
    namespace: envd-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: envd
  namespace: envd-system
  labels:
    app.kubernetes.io/name: envd
spec:
  replicas: 1
  # One writer at a time: the new pod starts after the old one stops.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: envd
  template:
    metadata:
      labels:
        app.kubernetes.io/name: envd
      annotations:
        poc.internal/peer-root-sha256: "@PEER_ROOT_SHA256@"
        poc.internal/spec-key-sha256: "@SPEC_KEY_SHA256@"
    spec:
      serviceAccountName: envd
      # Only the envd container mounts the token, as the projected volume envd-api-token.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: envd
          image: "@ENVD_IMAGE@"
          args:
            - run
            - --upstream=@UPSTREAM@
            - --expect-id=spiffe://@MGMT_TRUST_DOMAIN@/api
            - --peer-bundle=/run/envd/peer-root/root.crt
            - --peer-trust-domain=@MGMT_TRUST_DOMAIN@
            - --spec-key-file=/run/envd/spec-key/spec.pub
            - --env=@POC_ENV@
            - --output-configmap=spire-system/cell-records
            - --gateway=https://cell-gateway.gateway-system.svc.cluster.local:8452
            - --gateway-id=spiffe://@POC_TRUST_DOMAIN@/cp/gateway
            - --hints-configmap=spire-system/attest-hints
            - --steps-configmap=cell-controller-system/cell-steps
            - --step-status-configmap=cell-controller-system/step-status
            - --cluster=@CLUSTER@
            - --bundle-mirror=@REGISTRY_ADDRESS@
            - --bundle-store=bundle-store.cell-system.svc.cluster.local:5000
            - --bundle-store-token=/var/run/secrets/bundle-store/token
            - --bundle-state-configmap=envd-system/bundle-state
            - --bundle-health-timeout=5m
            - --report-rate=5
            - --bundle-refill-every=60s
            # The operator keys and the input of the local revocations go together. envd reads the key file again on each
            # use, so a rotation needs no restart.
            - --operator-key-file=/run/envd/operator-key/keys.pub
            - --revocations-configmap=envd-system/local-revocations
          env:
            - name: SPIFFE_ENDPOINT_SOCKET
              value: unix:///run/spire/agent/agent.sock
            - name: OTEL_SERVICE_NAME
              value: envd
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector.observability-system.svc.cluster.local:4317
          ports:
            - name: health
              containerPort: 8080
          # The kubelet reaches the health port from the node (flow N23). The endpoint does not depend on
          # the management plane, so a pod that starts while mgmtd is down is Ready.
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: spire-agent-socket
              mountPath: /run/spire/agent
              readOnly: true
            - name: peer-root
              mountPath: /run/envd/peer-root
              readOnly: true
            - name: spec-key
              mountPath: /run/envd/spec-key
              readOnly: true
            - name: operator-key
              mountPath: /run/envd/operator-key
              readOnly: true
            - name: envd-api-token
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
            - name: bundle-store-token
              mountPath: /var/run/secrets/bundle-store
              readOnly: true
      volumes:
        - name: peer-root
          configMap:
            name: peer-root
        - name: spec-key
          configMap:
            name: mgmt-spec-key
        - name: operator-key
          configMap:
            name: operator-key
        # The bundle store accepts this token only for the audience bundle-store, and only from the account envd.
        - name: bundle-store-token
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  audience: bundle-store
                  expirationSeconds: 600
        - name: envd-api-token
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 3600
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
              - downwardAPI:
                  items:
                    - path: namespace
                      fieldRef:
                        fieldPath: metadata.namespace
---
# envd reads the signed local revocation entries from ConfigMap local-revocations, which only the operator scripts on the Mac
# write. Get names only that object, and envd needs no other verb on it.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: envd-revocations
  namespace: envd-system
rules:
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [local-revocations]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: envd-revocations
  namespace: envd-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: envd-revocations
subjects:
  - kind: ServiceAccount
    name: envd
    namespace: envd-system
---
# The apply engine of envd lists the Applications and asks Argo CD for a hard refresh of the Application root. On a
# rollback it terminates the running sync operation of root and of the component Applications. The render puts root and
# the components of the role in allow.json into resourceNames (components/lib/bundle-apps.sh). Nothing else in argocd.
# The right to patch also covers the spec of these Applications. That is no more than patch on root already gives,
# because root writes the spec of each component Application.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: envd-argocd
  namespace: argocd
rules:
  - apiGroups: [argoproj.io]
    resources: [applications]
    verbs: [list]
  - apiGroups: [argoproj.io]
    resources: [applications]
    resourceNames: "@ARGOCD_APPS@"
    verbs: [patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: envd-argocd
  namespace: argocd
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: envd-argocd
subjects:
  - kind: ServiceAccount
    name: envd
    namespace: envd-system
---
# The engine reads the NetworkPolicies that carry the harness label in every namespace, so that no bundle blocks a plane flow.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: envd-netpol-read
rules:
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: [list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: envd-netpol-read
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: envd-netpol-read
subjects:
  - kind: ServiceAccount
    name: envd
    namespace: envd-system
---
# The engine keeps its state in ConfigMap bundle-state. Create cannot name the object, and get and update name only that one.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: envd-bundle-state
  namespace: envd-system
rules:
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [create]
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [bundle-state]
    verbs: [get, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: envd-bundle-state
  namespace: envd-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: envd-bundle-state
subjects:
  - kind: ServiceAccount
    name: envd
    namespace: envd-system
