# The in-cluster bundle store. Argo CD reads hydrated bundles from it, and nothing else.
# Bundles live on a PersistentVolumeClaim from the default StorageClass, so they survive a pod restart.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: bundle-store
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: bundle-store
  labels:
    app.kubernetes.io/name: bundle-store
spec:
  serviceName: bundle-store
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: bundle-store
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bundle-store
    spec:
      serviceAccountName: bundle-store
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bundle-store
          image: docker.io/library/registry:3.1.2@sha256:38907510915c3f1604c7e83d6ab602ab3020d092f73bdaed8696773693ff768c
          ports:
            - name: http
              containerPort: 5000
          env:
            - name: OTEL_SERVICE_NAME
              value: bundle-store
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector.observability-system.svc.cluster.local:4318
            - name: REGISTRY_HTTP_DEBUG_ADDR
              value: ""
          readinessProbe:
            httpGet:
              path: /v2/
              port: http
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/registry
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: bundle-store
  labels:
    app.kubernetes.io/name: bundle-store
spec:
  selector:
    app.kubernetes.io/name: bundle-store
  ports:
    - name: http
      port: 5000
      targetPort: http
