# SPIRE server of one trust domain. render.sh replaces the @SPIRE_*@ tokens, and keeps each
# "section" below only when the cluster needs it. hydrate replaces @CELL_NAME@.
# The server API listens on 8081 for agents. Local clients, health checks and
# spire-controller-manager use the admin socket.
server {
  bind_address = "0.0.0.0"
  bind_port = 8081
  socket_path = "/run/spire/sockets/api.sock"
  trust_domain = "@SPIRE_TRUST_DOMAIN@"
  data_dir = "/run/spire/data"
  log_level = "INFO"
  log_format = "json"
  ca_key_type = "ec-p256"
  ca_ttl = "@SPIRE_CA_TTL@"
  # SPIRE_SVID_TTL in cells/<cluster>.env sets both SVID lifetimes, and render.sh checks its range.
  # dev-cp uses 1m, so a gate sees two agent rotations in about a minute. An agent whose SVID
  # expires exits (pkg/agent/svid/rotator.go), and the restarted container attests as a new agent.
  # While the slow-tier marker build/gate/m9-svid-ttl exists, scripts/lib.sh takes SPIRE_SVID_TTL
  # of dev-cp from it (mise run svid-ttl -- set 1h), and mise run svid-ttl -- restore removes it.
  default_x509_svid_ttl = "@SPIRE_SVID_TTL@"
  agent_ttl = "@SPIRE_SVID_TTL@"
  # cluster_jwt agents cannot re-attest, so the server prunes them after their SVID expires.
  prune_attested_nodes_expired_for = "1h"
  prune_tofu_nodes = true
  # The per-IP limit would serialise every agent behind one kind node address.
  # The cluster_jwt plugin applies its own limit per cell. k8s_psat has no limit, and each of its
  # attestations costs one TokenReview on the API server, a failed one too.
  ratelimit {
    attestation = false
  }
}

plugins {
  DataStore "sql" {
    plugin_data {
      database_type = "sqlite3"
      connection_string = "/run/spire/data/datastore.sqlite3"
    }
  }

  # section: keys_memory
  # CA keys stay in memory. After a restart the server signs a new CA through the upstream authority.
  KeyManager "memory" {
    plugin_data {}
  }
  # end: keys_memory

  # section: keys_disk
  # With no upstream authority, the CA is a self-signed root. Its key lives on the data volume, so a
  # restart keeps the root, and every peer copy of it stays valid.
  KeyManager "disk" {
    plugin_data {
      keys_path = "/run/spire/data/keys.json"
    }
  }
  # end: keys_disk

  # section: cluster_jwt
  NodeAttestor "cluster_jwt" {
    plugin_cmd = "/run/spire/plugins/cluster-jwt-server"
    plugin_checksum = "@SPIRE_PLUGIN_CHECKSUM@"
    plugin_data {
      env = "@POC_ENV@"
      trust_domain = "@SPIRE_TRUST_DOMAIN@"
      records_dir = "/run/spire/records"
      record_public_keys = @SPIRE_RECORD_PUBLIC_KEYS@
      # The operator keys verify the local revocations that envd holds in key local-revocations.json of the records. The
      # ban container reads them from this file too. The render keeps the list on one line, as operator_pin of
      # components/lib/operator-key.sh reads it.
      operator_public_keys = @SPIRE_OPERATOR_PUBLIC_KEYS@
      # The plugin loads the records again at this interval. The kubelet needs up to a minute to update the
      # mounted ConfigMap, so a record takes effect within about that time plus this interval.
      reload_interval = "10s"
      # The marks refuse a record that an older revision supersedes, and they survive a restart.
      marks_file = "/run/spire/data/cluster_jwt-marks.json"
      # The slowest reply to a challenge in the gate:m2 runs of 2026-11-09 took 9 ms. The bound is
      # the larger of 10s and three times that time.
      challenge_timeout = "10s"
      # On unknown_kid for a cell with a record, the plugin patches this ConfigMap, which envd creates. envd carries the hint to
      # mgmtd, which checks the keys of the cell at once. The render keeps this line only when the server has an API token.
      hint_configmap = "spire-system/attest-hints"
    }
  }
  # end: cluster_jwt

  # section: k8s_psat
  # Plane workloads of this cluster attest with k8s_psat agent sidecars. Each sidecar gets its own
  # agent ID from its pod UID, so two sidecars on one node never share an agent or its entries.
  # The plugin ignores keys that it does not know, so a render test pins this exact key.
  NodeAttestor "k8s_psat" {
    plugin_data {
      clusters = {
        "@CELL_NAME@" = {
          service_account_allow_list = @SPIRE_PSAT_ACCOUNTS@
          use_pod_uid_for_agent_id = true
        }
      }
    }
  }
  # end: k8s_psat

  # section: upstream_disk
  # The intermediate CA from Secret spire-upstream signs the server CA.
  UpstreamAuthority "disk" {
    plugin_data {
      key_file_path = "/run/spire/upstream/intermediate.key"
      cert_file_path = "/run/spire/upstream/intermediate.crt"
      bundle_file_path = "/run/spire/upstream/root.crt"
    }
  }
  # end: upstream_disk
}

# Only the collector in this cluster scrapes the metrics. The default-deny policy of spire-system
# admits no pod on this port until a policy for the collector exists.
telemetry {
  Prometheus {
    host = "0.0.0.0"
    port = 9988
  }
}
