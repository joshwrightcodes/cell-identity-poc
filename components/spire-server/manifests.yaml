# The SPIRE server of one trust domain. render.sh fills in the plugin image, the config checksum,
# the agent node addresses and the local workload peers. It drops each object,
# container and volume that the cluster does not need:
#   - with no agent cell: the plugin installer, the record volume, the node port and the policy
#     for the agent nodes.
#   - with no upstream authority: ExternalSecret spire-upstream and its volume.
#   - with no local workload: the API token, the k8s_psat RBAC and the policies of flows N8 and N9.
#   - when the external-secrets bundle holds Namespace spire-system as its store namespace: the
#     Namespace below.
apiVersion: v1
kind: Namespace
metadata:
  name: spire-system
  labels:
    istio-injection: disabled
    pod-security.kubernetes.io/enforce: restricted
  annotations:
    # A bundle that drops the namespace, or a deleted Application, must not delete it and the CA
    # key on the data volume.
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: spire-server
  namespace: spire-system
automountServiceAccountToken: false
---
# The External Secrets Operator copies the upstream CA from the secret manager into Secret
# spire-upstream. Remote keys follow <cluster>/<service>/<key>. secrets:connect applies
# SecretStore poc-secrets in this namespace. The CRD comes from the external-secrets bundle in an
# earlier sync wave.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: spire-upstream
  namespace: spire-system
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: poc-secrets
  target:
    name: spire-upstream
    creationPolicy: Owner
    deletionPolicy: Retain
    # With a template, ESO does not copy the labels and annotations of this object, Argo CD
    # tracking included, to the Secret. The template has no data, so the keys pass through.
    template:
      type: Opaque
      metadata:
        labels:
          app.kubernetes.io/name: spire-server
  data:
    - secretKey: intermediate-key
      remoteRef:
        key: "@CELL_NAME@/spire-server/intermediate-key"
    - secretKey: intermediate-cert
      remoteRef:
        key: "@CELL_NAME@/spire-server/intermediate-cert"
    - secretKey: root-cert
      remoteRef:
        key: "@CELL_NAME@/spire-server/root-cert"
---
# The k8s_psat plugin reviews each agent token, and reads the pod and the node of the agent.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: spire-server-psat
rules:
  - apiGroups: ["authentication.k8s.io"]
    resources: ["tokenreviews"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: spire-server-psat
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: spire-server-psat
subjects:
  - kind: ServiceAccount
    name: spire-server
    namespace: spire-system
---
# The cluster_jwt plugin writes a key hint with a merge patch of ConfigMap attest-hints, which envd creates. It reads and patches
# that one object and no other.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: spire-server-hints
  namespace: spire-system
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["attest-hints"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: spire-server-hints
  namespace: spire-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: spire-server-hints
subjects:
  - kind: ServiceAccount
    name: spire-server
    namespace: spire-system
---
# One ClusterStaticEntry per key. Each key name ends in .yaml.
apiVersion: v1
kind: ConfigMap
metadata:
  name: spire-entries
  namespace: spire-system
data: {}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: spire-server
  namespace: spire-system
  labels:
    app.kubernetes.io/name: spire-server
spec:
  serviceName: spire-server
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: spire-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: spire-server
      annotations:
        # SPIRE reads its configuration only at start, and a change restarts the pod. The cluster_jwt plugin
        # reloads the cell records from the volume records while the server runs.
        cell.poc.internal/config-checksum: "@SPIRE_CONFIG_CHECKSUM@"
    spec:
      serviceAccountName: spire-server
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # The plugin image copies its static binary into the shared plugin volume.
        - name: install-plugin
          image: "@SPIRE_PLUGIN_IMAGE@"
          args: ["install", "/run/spire/plugins"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - name: plugins
              mountPath: /run/spire/plugins
      containers:
        - name: spire-server
          image: ghcr.io/spiffe/spire-server:1.15.5@sha256:584a9c5cc95b9457f5033e7e4488d603fffe5ec48a80c4dba14b05c5e1c2c384
          args: ["-config", "/run/spire/config/server.conf"]
          ports:
            - name: grpc
              containerPort: 8081
          # The image has no shell. The probes run the server binary against the admin socket.
          readinessProbe:
            exec:
              command: ["/opt/spire/bin/spire-server", "healthcheck", "-socketPath", "/run/spire/sockets/api.sock"]
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: ["/opt/spire/bin/spire-server", "healthcheck", "-shallow", "-socketPath", "/run/spire/sockets/api.sock"]
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: config
              mountPath: /run/spire/config
              readOnly: true
            - name: data
              mountPath: /run/spire/data
            - name: sockets
              mountPath: /run/spire/sockets
            - name: plugins
              mountPath: /run/spire/plugins
              readOnly: true
            - name: upstream
              mountPath: /run/spire/upstream
              readOnly: true
            - name: records
              mountPath: /run/spire/records
              readOnly: true
            # go-plugin creates the plugin socket in the temporary directory.
            - name: tmp
              mountPath: /tmp
            # The k8s_psat plugin uses the in-cluster API client. Only this container gets the token.
            - name: api-token
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
        - name: spire-controller-manager
          image: ghcr.io/spiffe/spire-controller-manager:0.8.0@sha256:19e418e9d7f23fe82cbabccdc3e71861590f69a1fa8451bfdb267d7371b2b73e
          args: ["--config", "/run/spire/controller-manager/config.yaml"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: controller-manager-config
              mountPath: /run/spire/controller-manager
              readOnly: true
            - name: entries
              mountPath: /run/spire/entries
              readOnly: true
            - name: sockets
              mountPath: /run/spire/sockets
        # The ban container reads the cells that the cluster_jwt plugin refuses from server.conf, the records and the marks
        # file, and bans their agents through the admin socket every 10 s. It mounts each volume read-only at the path of
        # the server container, so the paths in server.conf resolve the same. It sets no user, so it runs as the pod user,
        # who owns the admin socket. It needs no API token. Its health endpoint listens on the loopback only.
        - name: agent-ban
          image: "@SPIRE_PLUGIN_IMAGE@"
          args: ["ban-agents", "--server-config", "/run/spire/config/server.conf", "--socket", "/run/spire/sockets/api.sock", "--every", "10s", "--health", "127.0.0.1:8086"]
          env:
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector.observability-system.svc.cluster.local:4317
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - name: config
              mountPath: /run/spire/config
              readOnly: true
            - name: data
              mountPath: /run/spire/data
              readOnly: true
            - name: records
              mountPath: /run/spire/records
              readOnly: true
            - name: sockets
              mountPath: /run/spire/sockets
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: spire-server
        - name: controller-manager-config
          configMap:
            name: spire-controller-manager
        - name: entries
          configMap:
            name: spire-entries
        - name: sockets
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        - name: plugins
          emptyDir:
            sizeLimit: 128Mi
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
        # The disk UpstreamAuthority reads the intermediate key, the intermediate certificate and the root.
        - name: upstream
          secret:
            secretName: spire-upstream
            defaultMode: 0440
            items:
              - key: intermediate-key
                path: intermediate.key
              - key: intermediate-cert
                path: intermediate.crt
              - key: root-cert
                path: root.crt
        # envd writes ConfigMap cell-records: the signed spec and the signed record of each cell. The
        # ConfigMap does not exist until envd has pulled the first spec, and the plugin accepts no cell
        # until then.
        - name: records
          configMap:
            name: cell-records
            optional: true
        # The same files as the automatic token mount, for the server container only.
        - name: api-token
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 600
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
              - downwardAPI:
                  items:
                    - path: namespace
                      fieldRef:
                        fieldPath: metadata.namespace
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
---
# Agents in the cell clusters reach the server API on node port 30081. Local traffic policy keeps
# the client address, so the NetworkPolicy can match the agent node addresses. Without agent cells
# the Service has the type ClusterIP, and only the local plane workloads use it.
apiVersion: v1
kind: Service
metadata:
  name: spire-server
  namespace: spire-system
  labels:
    app.kubernetes.io/name: spire-server
spec:
  type: NodePort
  externalTrafficPolicy: Local
  selector:
    app.kubernetes.io/name: spire-server
  ports:
    - name: grpc
      port: 8081
      targetPort: grpc
      nodePort: 30081
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: spire-system
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
# Flow N8: the SPIRE agent sidecar of each local plane workload reaches the server API. Each
# workload pod carries the label app.kubernetes.io/name=<service account>.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: spire-server-workloads
  namespace: spire-system
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: spire-server
  policyTypes: [Ingress]
  ingress:
    - from: "@SPIRE_WORKLOAD_PEERS@"
      ports:
        - protocol: TCP
          port: 8081
---
# Flow N15: the collector of the cluster scrapes the metrics port, and no other pod reaches it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: spire-server-metrics
  namespace: spire-system
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: spire-server
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: otel-collector
      ports:
        - protocol: TCP
          port: 9988
---
# Flow N9: the k8s_psat plugin reaches the API server for TokenReview and the pod and node reads.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: spire-server-api
  namespace: spire-system
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: spire-server
  policyTypes: [Egress]
  egress:
    - to: "@API_SERVER_PEERS@"
      ports:
        - protocol: TCP
          port: "@API_SERVER_PORT@"
    - to:
        - ipBlock:
            cidr: "@API_SERVICE_IP@/32"
      ports:
        - protocol: TCP
          port: 443
