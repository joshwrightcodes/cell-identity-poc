# The Grafana admin password. The generator makes it inside the cluster, so no secret manager and
# no token take part. refreshPolicy CreatedOnce makes the Secret once and never changes it, and
# creationPolicy Orphan keeps it when the ExternalSecret goes away. Grafana reads the file only
# when it creates its database, so mise run obs:rotate-password changes the live password through
# the Grafana API and then replaces the Secret.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: grafana-admin
  namespace: observability-system
spec:
  length: 32
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin
  namespace: observability-system
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshPolicy: CreatedOnce
  target:
    name: grafana-admin
    creationPolicy: Orphan
    # With a template, ESO does not copy the labels and annotations of this object, Argo CD
    # tracking included, to the Secret.
    template:
      type: Opaque
      metadata:
        labels:
          app.kubernetes.io/name: lgtm
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: grafana-admin
