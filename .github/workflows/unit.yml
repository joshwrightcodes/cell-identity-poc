name: unit

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    # The tests take about 28 minutes in all on a small runner: with -parallel 4 on 2026-11-23, test/scripts took 1255 s and test/render 408 s, one after the other, 1663 s in all. The job allows that time plus 50 percent (42 minutes) and 3 minutes for the setup. Each package has a go test timeout of 32 minutes in mise.toml.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: 2026.11.3
          install_args: go yq jq helm kustomize
      - run: mise run test
      - run: mise run lint
